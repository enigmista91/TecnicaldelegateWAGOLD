<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WA Gold - TD Dashboard 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <style>
        .race-btn {
            border-left: 3px solid transparent;
        }
        .race-btn.active {
            border-left-color: #0d6efd;
            background-color: #e9ecef;
            font-weight: bold;
        }
        .anomaly { background-color: #ffeeba !important; font-weight: bold; }
        
                                @media print {
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .table-dark th { 
                background-color: #212529 !important; 
                color: white !important; 
            }
            .table-success { background-color: #d1e7dd !important; }
            .table-warning { background-color: #fff3cd !important; }
            .table-danger { background-color: #f8d7da !important; }
            .table-info { background-color: #cff4fc !important; }
            .badge { border: 1px solid black; }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-print-none" id="sidebar">
                <div class="px-3 mb-4">
                    <h5 class="text-warning fw-bold">🥇 WA Gold TD</h5>
                    <select id="meeting-selector" class="form-select form-select-sm mt-3" onchange="switchMeeting()">
                    </select>
                </div>
                
                <div class="px-2" id="nav-general">
                    <button class="nav-link w-100 text-start btn btn-sm mb-1 active" onclick="showOverview()">📊 Panoramica Meeting</button>
                    <button class="nav-link w-100 text-start btn btn-sm mb-1" onclick="showCallRoom()">⏱ Call Room Live</button>
                    <button class="nav-link w-100 text-start btn btn-sm mb-1" onclick="showNotes()">📝 Appunti & Dispositivo</button>
                    <button class="nav-link w-100 text-start btn btn-sm mb-1 text-primary fw-bold" onclick="syncWise()">🔄 Sincronizza WISE</button>
                    <button class="nav-link w-100 text-start btn btn-sm mb-1 text-success fw-bold" onclick="showShoeControl()">👟 Controllo Scarpe</button>
                    <button class="nav-link w-100 text-start btn btn-sm mb-1 text-danger fw-bold" onclick="showAthleteSearch()">🔍 Ricerca & Doping</button>
                </div>
                
                <hr class="text-secondary">
                <div class="px-2" id="race-list"></div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 main-content" id="main-content">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

        // 2. Initialization
        async function init() {
            if (window.__INJECTED_MEETING__) {
                const m = window.__INJECTED_MEETING__;
                let mId = "default";
                let rUrl = "";
                if (m.info && m.info.url) {
                    const match = m.info.url.match(/(REG\d+|COD\d+)/i);
                    if (match) mId = match[0].toUpperCase();
                    rUrl = m.info.url.replace('/Iscrizioni/IndexPerGara.html', '/Risultati/IndexRisultatiPerGara.html');
                }
                
                await db.meetings.put({
                    id: mId,
                    name: m.info ? m.info.name : "Meeting Senza Nome",
                    date: new Date().toISOString(),
                    data: m.races,
                    resultsUrl: rUrl
                });
                
                // Also init races
                for (const race of m.races) {
                    const raceId = mId + '_' + race.nome_gara;
                    const existing = await db.races.get(raceId);
                    if (!existing) {
                        await db.races.put({
                            id: raceId,
                            meetingId: mId,
                            name: race.nome_gara,
                            scheduledTime: '',
                            isCompleted: 0
                        });
                    }
                }
            }
            
            await loadMeetingList();
        }

        async function loadMeetingList() {
            const meetings = await db.meetings.toArray();
            const sel = document.getElementById('meeting-selector');
            sel.innerHTML = '';
            
            if (meetings.length === 0) {
                sel.innerHTML = '<option>Nessun meeting caricato</option>';
                document.getElementById('main-content').innerHTML = '<div class="alert alert-info mt-4">Genera un meeting usando lo script di scraping per iniziare.</div>';
                return;
            }
            
            // Sort by date desc
            meetings.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            meetings.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                sel.appendChild(opt);
            });
            
            // If injected, select it
            if (window.__INJECTED_MEETING__) {
                const url = window.__INJECTED_MEETING__.info.url || "";
                const match = url.match(/(REG\d+|COD\d+)/i);
                if (match) {
                    sel.value = match[0].toUpperCase();
                } else {
                    // Fallback to "default" if no code is found
                    sel.value = "default";
                }
            }
            
            await switchMeeting();
        }

        async function switchMeeting() {
            const sel = document.getElementById('meeting-selector');
            if (!sel.value) return;
            
            currentMeeting = await db.meetings.get(sel.value);
            await await buildSidebar();
            showOverview();
        }

        // Helpers
        function isFieldEvent(name) {
            const lower = name.toLowerCase();
            return ['salto', 'lungo', 'alto', 'asta', 'triplo', 'peso', 'disco', 'martello', 'giavellotto', 'vortex'].some(k => lower.includes(k));
        }
        function isTripleJump(name) {
            return name.toLowerCase().includes('triplo');
        }
        function isVerticalJump(name) {
            const lower = name.toLowerCase();
            return lower.includes('alto') || lower.includes('asta');
        }
        function getFieldConfig(index) {
            const raw = localStorage.getItem('field_data_' + currentMeeting.id + '_' + index);
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return { numGroups: 1, method: 'inverse', progression: '', battuta1: '', battuta2: '', groups: null };
        }
        function saveFieldConfig(index, updates) {
            const current = getFieldConfig(index);
            const updated = Object.assign({}, current, updates);
            localStorage.setItem('field_data_' + currentMeeting.id + '_' + index, JSON.stringify(updated));
            return updated;
        }
        window.saveTripleJumpBoard = function(index, boardNum, val) {
            const cleanVal = (val || '').trim();
            const updates = boardNum === 1 ? { battuta1: cleanVal } : { battuta2: cleanVal };
            const updated = saveFieldConfig(index, updates);
            
            // Update print badge in Overview if visible
            const badgeEl = document.getElementById('tj-print-badge-' + index);
            if (badgeEl) {
                const boards = [updated.battuta1, updated.battuta2].filter(Boolean);
                if (boards.length > 0) {
                    badgeEl.textContent = '📐 Battute: ' + boards.join(' / ');
                    badgeEl.classList.remove('d-none');
                } else {
                    badgeEl.textContent = '';
                    badgeEl.classList.add('d-none');
                }
            }
            // If currently on the race page and start list is generated, refresh it
            if (activeRaceIndex === index && document.getElementById('results-' + index) && document.getElementById('results-' + index).innerHTML.trim() !== '') {
                generateField(index);
            }
        };
        window.saveProgressionConfig = function(index, val) {
            saveFieldConfig(index, { progression: (val || '').trim() });
            if (activeRaceIndex === index && document.getElementById('results-' + index) && document.getElementById('results-' + index).innerHTML.trim() !== '') {
                generateField(index);
            }
        };
        function isMiddleDistance(name) {
            const lower = name.toLowerCase();
            return ['600', '800', '1000', '1200', '1500', 'miglio', '2000', '3000', 'siepi', '5000', '10000', 'marcia'].some(k => lower.includes(k));
        }
        function getMinutesPerHeat(nomeGara) {
            const lower = nomeGara.toLowerCase();
            if (lower.includes('10000') || lower.includes('marcia 10')) return 40;
            if (lower.includes('5000') || lower.includes('marcia 5')) return 22;
            if (lower.includes('3000') || lower.includes('siepi')) return 15;
            if (lower.includes('1500') || lower.includes('miglio')) return 8;
            if (lower.includes('800') || lower.includes('1000')) return 6;
            if (lower.includes('400')) return 5;
            return 4;
        }
        function estimateDuration(nomeGara, iscrittiCount, isMiddle, heatsCount, customInterval) {
            const lower = nomeGara.toLowerCase();
            if (isFieldEvent(nomeGara)) {
                if (lower.includes('asta')) return iscrittiCount * 3 + 15;
                if (lower.includes('alto')) return iscrittiCount * 2 + 10;
                return Math.ceil(iscrittiCount * 1.5) + 15;
            }
            let assumedHeats = heatsCount || Math.ceil(iscrittiCount / (isMiddle ? 12 : 6));
            const minsPerHeat = customInterval ? parseInt(customInterval) : getMinutesPerHeat(nomeGara);
            return assumedHeats * minsPerHeat;
        }

        // Sidebar
        function buildSidebar() {
            const list = document.getElementById('race-list');
            list.innerHTML = '';
            
            const groups = { 'Corse': [], 'Salti': [], 'Lanci': [] };
            currentMeeting.data.forEach((race, index) => {
                let cat = 'Corse';
                if (isFieldEvent(race.nome_gara)) {
                    cat = ['peso', 'disco', 'martello', 'giavellotto', 'vortex'].some(k => race.nome_gara.toLowerCase().includes(k)) ? 'Lanci' : 'Salti';
                }
                groups[cat].push({race, index});
            });
            
            for (const [groupName, races] of Object.entries(groups)) {
                if (races.length === 0) continue;
                const header = document.createElement('h6');
                header.className = 'mt-3 mb-2 text-warning fw-bold border-bottom pb-1';
                header.textContent = groupName;
                list.appendChild(header);
                
                races.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-link text-start mb-1 btn btn-sm w-100 text-truncate race-btn';
                    btn.style.fontSize = '0.85rem';
                    btn.textContent = item.race.nome_gara;
                    btn.onclick = () => showRace(item.index, btn);
                    list.appendChild(btn);
                });
            }
        }
        
        function clearActiveNav() {
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            if(callRoomTimer) clearInterval(callRoomTimer);
        }

        // Views
                        async function showOverview() {
            clearActiveNav();
            document.querySelectorAll('#nav-general .nav-link')[0].classList.add('active');
            
            let total = 0, anomaliesCount = 0, totalDurationMins = 0;
            
            const racesDb = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const timeMap = {};
            const compMap = {};
            racesDb.forEach(r => {
                timeMap[r.name] = r.scheduledTime || '';
                compMap[r.name] = r.isCompleted;
            });
            
            let table = `<table class="table table-striped mt-4 align-middle"><thead class="table-dark"><tr><th>Orario (Call Room)</th><th>Gara</th><th>Iscritti</th><th>Tipo</th><th>Stima Durata</th><th>Stato</th></tr></thead><tbody>`;
            
            currentMeeting.data.forEach((r, index) => {
                total += r.numero_iscritti;
                const field = isFieldEvent(r.nome_gara);
                const isMiddle = isMiddleDistance(r.nome_gara);
                let confHeats = null, confInterval = null;
                if (!field) {
                    const savedTrack = localStorage.getItem('race_data_' + currentMeeting.id + '_' + index);
                    if (savedTrack) {
                        try {
                            const td = JSON.parse(savedTrack);
                            if (td.heats) confHeats = td.heats.length;
                            if (td.heatInterval) confInterval = td.heatInterval;
                        } catch(e) {}
                    }
                }
                const duration = estimateDuration(r.nome_gara, r.numero_iscritti, isMiddle, confHeats, confInterval);
                totalDurationMins += duration;
                const anomalies = r.iscritti.filter(i => !i.accredito.trim()).length;
                if (anomalies > 0) anomaliesCount++;
                
                const schedTime = timeMap[r.nome_gara] || '';
                const isComp = compMap[r.nome_gara];
                
                let statoHtml = `<span class="${anomalies > 0 ? 'text-danger fw-bold' : ''}">${anomalies} anom.</span>`;
                if (isComp && currentMeeting.resultsUrl) {
                    statoHtml = `<a href="${currentMeeting.resultsUrl}" target="_blank" class="badge bg-success text-decoration-none">✅ Risultati</a>`;
                } else if (isComp) {
                    statoHtml = `<span class="badge bg-success">✅ Conclusa</span>`;
                }
                
                let extraRaceControls = '';
                if (isTripleJump(r.nome_gara)) {
                    const fc = getFieldConfig(index);
                    const b1 = fc.battuta1 || '';
                    const b2 = fc.battuta2 || '';
                    const boardsStr = [b1, b2].filter(Boolean).join(' / ');
                    extraRaceControls = `
                        <div class="mt-1 d-flex align-items-center flex-wrap gap-1 d-print-none fw-normal">
                            <span class="badge bg-secondary">📐 Battute (max 2):</span>
                            <input type="text" class="form-control form-control-sm" style="width: 85px;" placeholder="1ª es. 11m" value="${b1}" onchange="saveTripleJumpBoard(${index}, 1, this.value)" title="1ª Battuta Salto Triplo">
                            <input type="text" class="form-control form-control-sm" style="width: 85px;" placeholder="2ª es. 13m" value="${b2}" onchange="saveTripleJumpBoard(${index}, 2, this.value)" title="2ª Battuta Salto Triplo (opzionale)">
                        </div>
                        <div id="tj-print-badge-${index}" class="${boardsStr ? '' : 'd-none'} small text-primary fw-bold mt-1">📐 Battute: ${boardsStr}</div>
                    `;
                } else if (isVerticalJump(r.nome_gara)) {
                    const fc = getFieldConfig(index);
                    if (fc.progression) {
                        extraRaceControls = `<div class="small text-muted fw-normal mt-1">📏 Prog: ${fc.progression}</div>`;
                    }
                }
                
                table += `<tr>
                    <td style="width: 120px;">
                        <input type="time" class="form-control form-control-sm d-print-none" value="${schedTime}" onchange="saveRaceTime(\`${r.nome_gara.replace(/'/g, '&apos;')}\`, this.value, this)">
                        <span class="d-none d-print-inline fw-bold fs-5">${schedTime || '--:--'}</span>
                    </td>
                    <td class="fw-bold">
                        <a href="#" onclick="showRace(${index}, null); return false;" class="text-decoration-none ${isComp ? 'text-success' : ''}">${r.nome_gara}</a>
                        ${extraRaceControls}
                    </td>
                    <td>${r.numero_iscritti}</td><td>${field ? 'Concorsi' : 'Corse'}</td>
                    <td>${Math.round(duration)} min</td>
                    <td>${statoHtml}</td>
                </tr>`;
            });
            table += `</tbody></table>`;
            
            const hours = Math.floor(totalDurationMins / 60);
            const mins = Math.round(totalDurationMins % 60);
            
            document.getElementById('main-content').innerHTML = `

        function formatMinsToTime(totalMins) {
            let mins = totalMins % 1440;
            if (mins < 0) mins += 1440;
            const hh = Math.floor(mins / 60).toString().padStart(2, '0');
            const mm = (mins % 60).toString().padStart(2, '0');
            return hh + ':' + mm;
        }

        async function renderCallRoomTable() {
            const container = document.getElementById('cr-table-container');
            if (!container) return;
            
            const getOff = (k, def) => parseInt(localStorage.getItem(k) || def);
            const offsets = {
                corse: { cr1: getOff('cr1_corse', 30), cr2: getOff('cr2_corse', 20), track: getOff('track_corse', 10) },
                concorsi: { cr1: getOff('cr1_concorsi', 45), cr2: getOff('cr2_concorsi', 30), track: getOff('track_concorsi', 20) },
                alto: { cr1: getOff('cr1_alto', 50), cr2: getOff('cr2_alto', 35), track: getOff('track_alto', 30) },
                asta: { cr1: getOff('cr1_asta', 60), cr2: getOff('cr2_asta', 45), track: getOff('track_asta', 40) }
            };
            
            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const now = new Date();
            const nowMins = now.getHours() * 60 + now.getMinutes();
            
            let rowsData = [];
            
            races.forEach(r => {
                if (!r.scheduledTime) return; // Skip races without time
                if (r.isCompleted) return; // Skip completed
                
                const [h, m] = r.scheduledTime.split(':').map(Number);
                const baseRaceMins = h * 60 + m;
                
                let cat = 'corse';
                const lower = r.name.toLowerCase();
                if (lower.includes('asta')) cat = 'asta';
                else if (lower.includes('alto')) cat = 'alto';
                else if (['salto', 'lungo', 'triplo', 'peso', 'disco', 'martello', 'giavellotto', 'vortex'].some(k => lower.includes(k))) cat = 'concorsi';
                
                const o = offsets[cat];
                const raceIndex = currentMeeting.data.findIndex(d => d.nome_gara === r.name);
                const raceObj = raceIndex > -1 ? currentMeeting.data[raceIndex] : null;
                
                if (cat === 'corse' && raceObj && raceObj.numero_iscritti > 0) {
                    const savedTrackStr = localStorage.getItem('race_data_' + currentMeeting.id + '_' + raceIndex);
                    let heatsCount = 1;
                    let heatInterval = getMinutesPerHeat(r.name);
                    let heatAthletes = [];
                    let isConfigured = false;
                    
                    if (savedTrackStr) {
                        try {
                            const rd = JSON.parse(savedTrackStr);
                            if (rd.heats && rd.heats.length > 0) {
                                heatsCount = rd.heats.length;
                                heatAthletes = rd.heats.map(h => h.length);
                                isConfigured = true;
                            }
                            if (rd.heatInterval) heatInterval = parseInt(rd.heatInterval) || heatInterval;
                        } catch(e) {}
                    } else {
                        const isMid = isMiddleDistance(r.name);
                        const defLanes = isMid ? 12 : 6;
                        heatsCount = Math.max(1, Math.ceil(raceObj.numero_iscritti / defLanes));
                    }
                    
                    for (let i = 0; i < heatsCount; i++) {
                        const heatRaceMins = baseRaceMins + (i * heatInterval);
                        const subLabel = heatsCount > 1
                            ? `<span class="badge bg-primary ms-2">Serie ${i+1}/${heatsCount}</span>`
                            : (isConfigured ? `<span class="badge bg-secondary ms-2">Serie Unica</span>` : '');
                        const athInfo = heatAthletes[i] !== undefined
                            ? `<small class="text-muted ms-1">(${heatAthletes[i]} atl.)</small>`
                            : (heatsCount > 1 ? `<small class="text-muted ms-1">(stima)</small>` : `<small class="text-muted ms-1">(${raceObj.numero_iscritti} atl.)</small>`);
                        
                        rowsData.push({
                            raceMins: heatRaceMins,
                            timeStr: formatMinsToTime(heatRaceMins),
                            subTimeNote: heatsCount > 1 ? `Serie ${i+1} (+${i * heatInterval}')` : '',
                            nameHtml: `<a href="#" onclick="showRace(${raceIndex}, null); return false;" class="text-decoration-none text-dark fw-bold">${r.name}</a> ${subLabel} ${athInfo}`,
                            o
                        });
                    }
                } else {
                    let groupBadge = '';
                    if (raceIndex > -1) {
                        const savedFieldStr = localStorage.getItem('field_data_' + currentMeeting.id + '_' + raceIndex);
                        if (savedFieldStr) {
                            try {
                                const fd = JSON.parse(savedFieldStr);
                                if (fd.numGroups && fd.numGroups > 1) {
                                    groupBadge = `<span class="badge bg-info text-dark ms-2">${fd.numGroups} Gruppi (A-${String.fromCharCode(64 + fd.numGroups)})</span>`;
                                }
                            } catch(e) {}
                        }
                    }
                    rowsData.push({
                        raceMins: baseRaceMins,
                        timeStr: r.scheduledTime,
                        subTimeNote: '',
                        nameHtml: raceIndex > -1
                            ? `<a href="#" onclick="showRace(${raceIndex}, null); return false;" class="text-decoration-none text-dark fw-bold">${r.name}</a> ${groupBadge}`
                            : `<span class="fw-bold">${r.name}</span>`,
                        o
                    });
                }
            });
            
            rowsData.sort((a, b) => a.raceMins - b.raceMins);
            
            let html = '<table class="table table-bordered text-center align-middle"><thead class="table-dark"><tr><th>Orario Gara</th><th>Gara / Serie</th><th>Apertura CR1</th><th>Apertura CR2</th><th>Ingresso Pista</th><th>Stato</th></tr></thead><tbody>';
            
            rowsData.forEach(item => {
                const { raceMins, timeStr, subTimeNote, nameHtml, o } = item;
                const cr1Mins = raceMins - o.cr1;
                const cr2Mins = raceMins - o.cr2;
                const trackMins = raceMins - o.track;
                
                let rowClass = "";
                let stato = "-";
                
                if (nowMins >= raceMins) {
                    rowClass = "table-success";
                    stato = "IN CORSO";
                } else if (nowMins >= trackMins) {
                    rowClass = "table-warning";
                    stato = "IN PISTA";
                } else if (nowMins >= cr2Mins) {
                    rowClass = "table-danger";
                    stato = "IN CR 2";
                } else if (nowMins >= cr1Mins) {
                    rowClass = "table-info";
                    stato = "IN CR 1";
                }
                
                html += `<tr class="${rowClass}">
                    <td class="fw-bold fs-5">${timeStr}${subTimeNote ? `<br><small class="text-muted fw-normal" style="font-size:0.75rem;">${subTimeNote}</small>` : ''}</td>
                    <td class="text-start">${nameHtml}</td>
                    <td>${formatMinsToTime(cr1Mins)} <br><small class="text-muted">(-${o.cr1}')</small></td>
                    <td>${formatMinsToTime(cr2Mins)} <br><small class="text-muted">(-${o.cr2}')</small></td>
                    <td>${formatMinsToTime(trackMins)} <br><small class="text-muted">(-${o.track}')</small></td>
                    <td class="fw-bold">${stato}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

                window.syncWise = async function() {
            if (!currentMeeting.resultsUrl) {
                alert("URL Risultati non trovato per questo meeting.");
                return;
            }
            try {
                // Try primary proxy
                let proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(currentMeeting.resultsUrl);
                let res = await fetch(proxyUrl);
                if (!res.ok) throw new Error("Proxy error");
                
                let json = await res.json();
                let htmlStr = json.contents;
                if (!htmlStr) throw new Error("Risposta vuota");
                
                // Parse HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlStr, "text/html");
                const links = Array.from(doc.querySelectorAll('a')).map(a => a.textContent.trim());
                
                const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
                let completedCount = 0;
                
                for (let r of races) {
                    if (r.isCompleted) continue;
                    if (links.some(l => l.includes(r.name) || r.name.includes(l) && l.length > 5)) {
                        r.isCompleted = 1;
                        await db.races.put(r);
                        completedCount++;
                    }
                }
                
                                alert(`Sincronizzazione completata! ${completedCount} nuove gare concluse.`);
                await buildSidebar();
                if (document.getElementById('cr-table-container')) {
                    renderCallRoomTable();
                } else if (document.getElementById('nav-general').querySelector('button.active').textContent.includes('Panoramica')) {
                    showOverview();
                }
            } catch (e) {
                alert("Errore di rete o proxy bloccato dai sistemi anti-bot FIDAL (Cloudflare). Riprova piu' tardi o aggiorna manualmente. Dettaglio: " + e.message);
                console.error(e);
            }
        }

// ====== LEGACY FUNCTIONS ======
function timeToSeconds(t) {
            if (!t) return 999999;
            t = t.trim();
            if (t.includes(':')) {
                const parts = t.split(':');
                return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
            return parseFloat(t) || 999999;
        }



        function validateProgression(inputElement, raceName) {
            const feedback = inputElement.nextElementSibling;
            const str = inputElement.value.replace(/,/g, ' ').trim();
            if (!str) {
                feedback.innerHTML = "Inserisci le misure separate da spazio o virgola. Saranno stampate sul foglio gara.";
                feedback.className = "form-text text-muted";
                inputElement.classList.remove('is-invalid', 'is-valid');
                return;
            }
            
            const measures = str.split(/\s+/).map(x => parseFloat(x));
            if (measures.some(isNaN)) {
                feedback.innerHTML = "Formato non valido. Inserisci solo numeri (es. 1.80 1.85).";
                feedback.className = "form-text text-danger";
                inputElement.classList.add('is-invalid');
                inputElement.classList.remove('is-valid');
                return;
            }
            
            // Check strict monotonicity
            for(let i = 1; i < measures.length; i++) {
                if (measures[i] <= measures[i-1]) {
                    feedback.innerHTML = "Le misure devono essere crescenti!";
                    feedback.className = "form-text text-danger";
                    inputElement.classList.add('is-invalid');
                    inputElement.classList.remove('is-valid');
                    return;
                }
            }
            
            const isPoleVault = raceName.toLowerCase().includes('asta');
            const minIncrement = isPoleVault ? 5 : 2; // in cm
            
            let valid = true;
            let errorMsg = "";
            let lastInc = 999;
            
            for (let i = 1; i < measures.length; i++) {
                const diffCm = Math.round((measures[i] - measures[i-1]) * 100);
                if (diffCm < minIncrement) {
                    valid = false;
                    errorMsg = `Errore TR 26.1: Incremento di ${diffCm}cm tra ${measures[i-1]} e ${measures[i]}. Minimo consentito: ${minIncrement}cm.`;
                    break;
                }
                if (diffCm > lastInc) {
                    valid = false;
                    errorMsg = `Errore TR 26.1: L'incremento non può aumentare. Precedente: ${lastInc}cm, Nuovo: ${diffCm}cm.`;
                    break;
                }
                lastInc = diffCm;
            }
            
            if (!valid) {
                feedback.innerHTML = errorMsg;
                feedback.className = "form-text text-danger";
                inputElement.classList.add('is-invalid');
                inputElement.classList.remove('is-valid');
            } else {
                feedback.innerHTML = "Progressione a norma WA TR 26.1 ✅";
                feedback.className = "form-text text-success";
                inputElement.classList.remove('is-invalid');
                inputElement.classList.add('is-valid');
            }
        }

            let allAthletes = [...race.iscritti].map(i => ({...i, val: parseAccreditoFloat(i.accredito)}));
            
            // Split into groups by accreditation tiers (Gruppo A = best marks, Gruppo B = next tier, etc.)
            let groups = [];
            if (numGroups > 1 && allAthletes.length > 1) {
                // Sort best to worst first (highest val first; -1 goes to the end)
                allAthletes.sort((a, b) => b.val - a.val);
                const actualGroups = Math.min(numGroups, allAthletes.length);
                const baseSize = Math.floor(allAthletes.length / actualGroups);
                const extra = allAthletes.length % actualGroups;
                let cursor = 0;
                for (let g = 0; g < actualGroups; g++) {
                    const size = baseSize + (g < extra ? 1 : 0);
                    groups.push(allAthletes.slice(cursor, cursor + size));
                    cursor += size;
                }
            } else {
                groups = [allAthletes];
            }
            
            // Apply starting order inside each group
            groups.forEach(grp => {
                if (method === 'inverse') {
                    grp.sort((a, b) => a.val - b.val); // lowest to highest inside the group (best jumps/throws last)
                } else {
                    grp.sort(() => Math.random() - 0.5);

        function generateTrack(index, isMiddle) {
            const race = currentMeeting.data[index];
            const lanesInputStr = document.getElementById(`lanes-${index}`).value;
            const intervalInputEl = document.getElementById(`heat-interval-${index}`);
            const heatInterval = intervalInputEl ? (parseInt(intervalInputEl.value) || getMinutesPerHeat(race.nome_gara)) : getMinutesPerHeat(race.nome_gara);
            
            let activeLanes = [];
            let maxLanes = 6;
            
            if (isMiddle) {
                maxLanes = parseInt(lanesInputStr) || 12;
            } else {
                activeLanes = lanesInputStr.replace(/[^0-9,]/g, '').split(',').map(Number).filter(x => x > 0);
                if (activeLanes.length === 0) activeLanes = [1,2,3,4,5,6];
                maxLanes = activeLanes.length;
            }
            
            let iscritti = [...race.iscritti].map(i => ({...i, val: timeToSeconds(i.accredito)}));
            iscritti.sort((a, b) => a.val - b.val); // fastest first
            
            const total = iscritti.length;
            const heatsCount = Math.ceil(total / maxLanes);
            
            const heats = Array.from({length: heatsCount}, () => []);
            let dir = 1;
            let current = 0;
            
            // Zig zag distribution
            iscritti.forEach(a => {
                heats[current].push(a);
                if (dir === 1) {
                    if (current < heatsCount - 1) current++;
                    else dir = -1;
                } else {
                    if (current > 0) current--;
                    else dir = 1;
                }
            });
            
            const raceData = { heats, isMiddle, maxLanes, activeLanes, lanesInputStr, heatInterval };
            localStorage.setItem('race_data_' + currentMeeting.id + '_' + index, JSON.stringify(raceData));
            
            const badge = document.getElementById(`est-time-${index}`);
            if (badge) {
                const updatedTime = estimateDuration(race.nome_gara, total, isMiddle, heatsCount, heatInterval);
                badge.textContent = `⏱ Stima: ${Math.round(updatedTime)} min`;
            }
            
            renderTrackHeats(index);
        }

            // Find athlete
            let athleteIndex = heats[fromHeat].findIndex(a => a.pettorale === pettorale);

                const athlete = heats[fromHeat].splice(athleteIndex, 1)[0];
                heats[toHeat].push(athlete);
                
                localStorage.setItem('race_data_' + currentMeeting.id + '_' + index, JSON.stringify(raceData));
                renderTrackHeats(index);
            }
        }

                                    <th>Apertura CR1 (-${cr1Off}')</th>
                                    <th>Uscita CR2 (-${cr2Off}')</th>
                                    <th>Ingresso Pista (-${trackOff}')</th>
                                    <th>Orario Partenza</th>
                                </tr>
                            </thead>
                            <tbody>`;
                heats.forEach((h, i) => {
                    const hMins = baseRaceMins + (i * heatInterval);
                    html += `<tr>
                        <td class="fw-bold">Serie ${i+1}</td>
                        <td>${h.length}</td>
                        <td class="table-info">${formatMinsToTime(hMins - cr1Off)}</td>
                        <td class="table-danger">${formatMinsToTime(hMins - cr2Off)}</td>
                        <td class="table-warning">${formatMinsToTime(hMins - trackOff)}</td>
                        <td class="table-success fw-bold fs-6">${formatMinsToTime(hMins)}</td>
                    </tr>`;
                });
                html += `</tbody></table></div></div>`;
            } else {
                html += `<div class="alert alert-warning py-2 small d-print-none">💡 <strong>Suggerimento Call Room:</strong> Inserisci l'<strong>Orario (1ª Serie/Gara)</strong> in alto a destra per esplodere automaticamente gli orari di Call Room (CR1, CR2, Ingresso Pista) e di partenza per ciascuna delle ${heatsCount} serie.</div>`;
            }
            
            // Preferred lanes for standard sprint
            const pref6 = [3, 4, 5, 6, 2, 1];
            const pref8 = [4, 5, 3, 6, 2, 7, 1, 8];
            const pref9 = [5, 6, 4, 7, 3, 8, 2, 9, 1];
            
            let basePref = pref6;
            const maxActive = Math.max(...activeLanes);
            if (maxActive > 6) basePref = pref8;
            if (maxActive > 8) basePref = pref9;
            
            // Filter basePref by activeLanes
            let pref = basePref.filter(l => activeLanes.includes(l));
            activeLanes.forEach(l => {
                if (!pref.includes(l)) pref.push(l); // fallback for unusual lanes
            });
            
            heats.forEach((h, i) => {
                let heatTimingBadges = '';
                if (baseRaceMins !== null) {
                    const hMins = baseRaceMins + (i * heatInterval);
                    heatTimingBadges = `
                        <div>
                            <span class="badge bg-info text-dark me-1">CR1: ${formatMinsToTime(hMins - cr1Off)}</span>
                            <span class="badge bg-danger me-1">CR2: ${formatMinsToTime(hMins - cr2Off)}</span>
                            <span class="badge bg-warning text-dark me-1">Pista: ${formatMinsToTime(hMins - trackOff)}</span>
                            <span class="badge bg-dark fs-6">🕒 Partenza: ${formatMinsToTime(hMins)}</span>
                        </div>`;
                }
                
                html += `<div class="mt-4" style="page-break-inside: avoid;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h5 class="mb-0">Serie ${i+1} <small class="text-muted">(${h.length} atleti)</small></h5>
                        ${heatTimingBadges}
                    </div>
                    <table class="table table-bordered table-sm">
                    <thead class="table-light"><tr><th>${isMiddle ? 'Pos' : 'Corsia'}</th><th>Pett</th><th>Atleta</th><th>Società</th><th>SB</th><th width="15%">Risultato</th><th width="5%">Pos</th><th class="d-print-none" width="10%">Sposta</th></tr></thead><tbody>`;
                
                if (!isMiddle) {
                    // Assign lanes
                    h.forEach((a, j) => {
                        a.lane = pref[j] || '-';
                    });
                    h.sort((a,b) => (a.lane === '-' ? 99 : a.lane) - (b.lane === '-' ? 99 : b.lane));
                } else {
                    h.forEach((a, j) => {
                        a.lane = j + 1;
                    });
                }
                
                h.forEach(a => {
                    const athleteName = a.fidal_link ? `<a href="${a.fidal_link}" target="_blank" class="text-decoration-none text-dark fw-bold">${a.nominativo}</a>` : `<span class="fw-bold">${a.nominativo}</span>`;
                    
                    // Heat selector
                    let selectHtml = `<select class="form-select form-select-sm" onchange="moveAthlete(${index}, ${i}, '${a.pettorale}', this)">`;
                    for(let x=0; x<heatsCount; x++) {
                        selectHtml += `<option value="${x}" ${x===i ? 'selected' : ''}>S ${x+1}</option>`;
                    }
                    selectHtml += `</select>`;
                    
                    html += `<tr><td><strong>${a.lane}</strong></td><td>${a.pettorale}</td><td>${athleteName}</td><td><small>${(a.societa || '').substring(0,20)}</small></td><td>${a.accredito}</td><td></td><td></td><td class="d-print-none">${selectHtml}</td></tr>`;
                });
                
                html += `</tbody></table></div>`;
            });
            
            if (isMiddle) {
                const numLaps = getLaps(race.nome_gara);
                html += `<div style="page-break-before: always;" class="mt-5"></div>
                <div class="d-flex justify-content-between align-items-center mb-2 d-print-none">
                    <h4 class="mt-4 text-primary">Foglio Contagiri (${race.nome_gara})</h4>
                    <div>
                        <a href="https://matteomircoli.it/contagiristatico/garav2.html" target="_blank" class="btn btn-outline-success btn-sm mt-4 me-2">⏱ Contagiri Elettronico</a>
                        <button class="btn btn-outline-primary btn-sm mt-4" onclick="window.print()">🖨️ Stampa Foglio Cartaceo</button>
                    </div>
                </div>
                `;
                const lapStyleEl = document.getElementById('lap-style-' + index);
                const lapStyle = lapStyleEl ? lapStyleEl.value : 'normal';

                html += `<h4 class="mt-4 d-none d-print-block">Foglio Contagiri - ${race.nome_gara}</h4>`;

                if (lapStyle === 'normal') {
                    html += `
                    <div class="d-print-none alert alert-info small"><strong>Stile Normale:</strong> Griglia vuota. Il giudice segna a mano il pettorale in base alla posizione (Pos).</div>`;
                    
                    heats.forEach((h, i) => {
                        if (h.length === 0) return;
                        html += `<div class="mt-4" style="page-break-inside: avoid;">
                            <h5>Contagiri - Serie ${i+1}</h5>
                            <table class="table table-bordered table-sm text-center" style="font-size: 0.8rem;">
                            <thead class="table-light"><tr><th width="5%">Pos</th><th width="10%">Pettorale</th>`;
                        for(let lap=numLaps; lap>=2; lap--) {
                            html += `<th>-${lap}</th>`;
                        }
                        html += `<th>ARRIVO</th></tr></thead><tbody>`;
                        
                        const numRows = h.length + 3;
                        for (let row = 1; row <= numRows; row++) {
                            html += `<tr><td><strong>${row}°</strong></td><td></td>`;
                            for(let lap=1; lap<=numLaps; lap++) {
                                html += `<td></td>`;
                            }
                            html += `</tr>`;
                        }
                        
                        html += `</tbody></table></div>`;
                    });
                } else {
                    html += `
                    <div class="d-print-none alert alert-info small"><strong>Stile World Athletics:</strong> Griglia precompilata con Pettorali/Nomi. Il giudice spunta il giro al passaggio dell'atleta.</div>`;
                    
                    heats.forEach((h, i) => {
                        if (h.length === 0) return;
                        const sortedH = [...h].sort((a,b) => (a.pettorale || '999').localeCompare(b.pettorale || '999'));
                        
                        html += `<div class="mt-4" style="page-break-inside: avoid;">
                            <h5>Contagiri - Serie ${i+1}</h5>
                            <table class="table table-bordered table-sm text-center align-middle" style="font-size: 0.8rem;">
                            <thead class="table-light"><tr><th width="8%">Pett.</th><th width="15%">Atleta</th>`;
                        for(let lap=numLaps; lap>=2; lap--) {
                            html += `<th>-${lap}</th>`;
                        }
                        html += `<th>ARRIVO</th></tr></thead><tbody>`;
                        
                        sortedH.forEach(a => {
                            html += `<tr>
                                <td class="fw-bold">${a.pettorale || ''}</td>
                                <td class="text-start">${a.nominativo}<br><small class="text-muted">${a.societa || ''}</small></td>`;
                            for(let lap=1; lap<=numLaps; lap++) {
                                html += `<td></td>`;
                            }
                            html += `</tr>`;
                        });
                        
                        for(let ex=0; ex<3; ex++) {
                            html += `<tr><td></td><td></td>`;
                            for(let lap=1; lap<=numLaps; lap++) {
                                html += `<td></td>`;
                            }
                            html += `</tr>`;
                        }
                        
                        html += `</tbody></table></div>`;
                    });
                }
            }
            
            document.getElementById(`results-${index}`).innerHTML = html;
            localStorage.setItem('race_' + currentMeeting.id + '_' + index, html);
        }

        </script>
</body>
</html>
