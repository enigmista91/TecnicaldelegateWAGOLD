<!DOCTYPE html>
<html lang="it" data-theme="night">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WA Gold - TD Dashboard 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <style>
        /* ==========================================================================
           WA GOLD TD DASHBOARD 2.0 — DESIGN SYSTEM (NIGHT SESSION DARK DEFAULT)
           ========================================================================== */
        :root,
        [data-theme="night"] {
            --app-bg: #0b1120;
            --app-surface: #111827;
            --app-surface-alt: #1e293b;
            --app-surface-elevated: #172033;
            --app-surface-hover: rgba(255, 255, 255, 0.04);
            --app-border: #283548;
            --app-border-strong: #334155;
            --app-text: #f1f5f9;
            --app-text-secondary: #cbd5e1;
            --app-muted: #94a3b8;
            --app-sidebar: #070b14;
            --app-sidebar-hover: #151e31;
            --app-sidebar-active: #1e293b;
            --app-sidebar-text: #cbd5e1;
            --app-accent: #f59e0b;
            --app-accent-soft: rgba(245, 158, 11, 0.16);
            --app-accent-fg: #fbbf24;
            --app-primary: #3b82f6;
            --app-primary-hover: #2563eb;
            --app-primary-soft: rgba(59, 130, 246, 0.18);
            --app-primary-fg: #93c5fd;
            --app-success: #10b981;
            --app-success-soft: rgba(16, 185, 129, 0.16);
            --app-success-fg: #34d399;
            --app-warning: #f59e0b;
            --app-warning-soft: rgba(245, 158, 11, 0.16);
            --app-warning-fg: #fbbf24;
            --app-danger: #f43f5e;
            --app-danger-soft: rgba(244, 63, 94, 0.16);
            --app-danger-fg: #fb7185;
            --app-info: #0ea5e9;
            --app-info-soft: rgba(14, 165, 233, 0.16);
            --app-info-fg: #38bdf8;
            --app-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
        }

        [data-theme="light"] {
            --app-bg: #f4f6f9;
            --app-surface: #ffffff;
            --app-surface-alt: #f8fafc;
            --app-surface-elevated: #f1f5f9;
            --app-surface-hover: rgba(15, 23, 42, 0.035);
            --app-border: #e2e8f0;
            --app-border-strong: #cbd5e1;
            --app-text: #0f172a;
            --app-text-secondary: #334155;
            --app-muted: #64748b;
            --app-sidebar: #0b1628;
            --app-sidebar-hover: #152540;
            --app-sidebar-active: #1e3356;
            --app-sidebar-text: #cbd5e1;
            --app-accent: #d97706;
            --app-accent-soft: #fef3c7;
            --app-accent-fg: #92400e;
            --app-primary: #2563eb;
            --app-primary-hover: #1d4ed8;
            --app-primary-soft: #dbeafe;
            --app-primary-fg: #1e40af;
            --app-success: #10b981;
            --app-success-soft: #d1fae5;
            --app-success-fg: #065f46;
            --app-warning: #f59e0b;
            --app-warning-soft: #fef3c7;
            --app-warning-fg: #92400e;
            --app-danger: #e11d48;
            --app-danger-soft: #ffe4e6;
            --app-danger-fg: #9f1239;
            --app-info: #0284c7;
            --app-info-soft: #e0f2fe;
            --app-info-fg: #075985;
            --app-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--app-bg);
            color: var(--app-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.45);
        }

        /* Layout Shell */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            min-width: 280px;
            max-width: 280px;
            background-color: var(--app-sidebar);
            color: var(--app-sidebar-text);
            border-right: 1px solid var(--app-border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 1rem 0.75rem;
            z-index: 1030;
            transition: transform 0.25s ease;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 1.75rem 2rem;
            background-color: var(--app-bg);
            color: var(--app-text);
        }

        /* Mobile Topbar & Drawer */
        .mobile-topbar {
            display: none;
            background-color: var(--app-sidebar);
            color: #fff;
            border-bottom: 1px solid var(--app-border);
            padding: 0.65rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1025;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1028;
        }

        @media (max-width: 991.98px) {
            .app-shell {
                flex-direction: column;
            }
            .mobile-topbar {
                display: flex;
            }
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            }
            .sidebar.show-mobile {
                transform: translateX(0);
            }
            .sidebar-backdrop.show-mobile {
                display: block;
            }
            .main-content {
                padding: 1.25rem 1rem;
            }
        }

        /* Brand Header */
        .brand-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.25rem 0.5rem 0.75rem 0.5rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
            margin-bottom: 0.85rem;
        }
        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
            color: #fff;
            font-weight: 800;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.03em;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.15;
            margin: 0;
        }
        .brand-subtitle {
            font-size: 0.72rem;
            color: #94a3b8;
            display: block;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fbbf24;
        }

        /* Sidebar Controls & Navigation */
        .sidebar-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            padding: 0 0.5rem;
            margin-bottom: 0.35rem;
        }

        #meeting-selector {
            background-color: #111827 !important;
            color: #f8fafc !important;
            border: 1px solid rgba(148, 163, 184, 0.22) !important;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.45rem 2rem 0.45rem 0.65rem;
        }
        #meeting-selector:focus {
            border-color: var(--app-accent) !important;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2) !important;
        }

        .sidebar .nav-link {
            color: var(--app-sidebar-text);
            border-radius: 8px;
            padding: 0.48rem 0.65rem;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .sidebar .nav-link:hover {
            background-color: var(--app-sidebar-hover);
            color: #ffffff;
        }
        .sidebar .nav-link.active {
            background-color: var(--app-sidebar-active);
            color: #ffffff;
            font-weight: 600;
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: inset 3px 0 0 var(--app-accent);
        }

        .race-btn {
            border-left: 3px solid transparent;
            justify-content: space-between;
            padding: 0.4rem 0.6rem !important;
            font-size: 0.8rem !important;
        }
        .race-btn.active {
            border-left-color: var(--app-accent) !important;
            background-color: var(--app-sidebar-active) !important;
            color: #ffffff !important;
            font-weight: 600 !important;
        }

        .race-cat-header {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #fbbf24;
            padding: 0.6rem 0.5rem 0.25rem 0.5rem;
            margin-top: 0.35rem;
            border-bottom: 1px solid rgba(251, 191, 36, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .race-count-pill {
            font-size: 0.7rem;
            padding: 0.08rem 0.42rem;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .race-done-pill {
            font-size: 0.68rem;
            padding: 0.08rem 0.42rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* Surface & Bootstrap Overrides */
        .card {
            background-color: var(--app-surface);
            color: var(--app-text);
            border: 1px solid var(--app-border);
            border-radius: 12px;
            box-shadow: var(--app-shadow);
        }
        .card-header {
            background-color: var(--app-surface-alt);
            color: var(--app-text);
            border-bottom: 1px solid var(--app-border);
            padding: 0.75rem 1.1rem;
            font-weight: 600;
        }
        .card-header:first-child {
            border-radius: 11px 11px 0 0;
        }

        .bg-light {
            background-color: var(--app-surface-alt) !important;
            color: var(--app-text) !important;
        }
        .text-dark {
            color: var(--app-text) !important;
        }
        .text-muted {
            color: var(--app-muted) !important;
        }
        .border, .border-top, .border-bottom {
            border-color: var(--app-border) !important;
        }
        hr {
            border-color: var(--app-border);
            opacity: 1;
        }

        /* Forms & Inputs */
        .form-control, .form-select, .input-group-text {
            background-color: var(--app-surface-alt);
            color: var(--app-text);
            border: 1px solid var(--app-border-strong);
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--app-surface-alt);
            color: var(--app-text);
            border-color: var(--app-primary);
            box-shadow: 0 0 0 3px var(--app-primary-soft);
        }
        .form-control::placeholder {
            color: var(--app-muted);
            opacity: 0.75;
        }

        /* Modern KPI Cards */
        .kpi-card {
            background-color: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: 12px;
            padding: 1.1rem 1.25rem;
            box-shadow: var(--app-shadow);
            position: relative;
            overflow: hidden;
            height: 100%;
        }
        .kpi-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--kpi-color, var(--app-primary));
        }
        .kpi-label {
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--app-muted);
            margin-bottom: 0.35rem;
        }
        .kpi-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--app-text);
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
        }
        .kpi-sub {
            font-size: 0.76rem;
            color: var(--app-muted);
            margin-top: 0.3rem;
        }

        /* Filter Pills & Search Bar */
        .filter-toolbar {
            background-color: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: 12px;
            padding: 0.65rem 0.9rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .filter-pill {
            border: 1px solid transparent;
            background: transparent;
            color: var(--app-muted);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.32rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .filter-pill:hover {
            color: var(--app-text);
            background-color: var(--app-surface-alt);
        }
        .filter-pill.active {
            background-color: var(--app-primary-soft);
            color: var(--app-primary-fg);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Tables */
        .table-container-card {
            background-color: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--app-shadow);
        }
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: var(--app-text);
            --bs-table-border-color: var(--app-border);
            --bs-table-striped-bg: rgba(148, 163, 184, 0.03);
            --bs-table-striped-color: var(--app-text);
            --bs-table-hover-bg: var(--app-surface-hover);
            --bs-table-hover-color: var(--app-text);
            color: var(--app-text);
            margin-bottom: 0;
        }
        .table thead th,
        .table-dark th,
        .table-light th,
        .table-light {
            background-color: var(--app-surface-alt) !important;
            color: var(--app-muted) !important;
            border-bottom: 1px solid var(--app-border-strong) !important;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.75rem 0.85rem;
        }
        .table td {
            padding: 0.7rem 0.85rem;
            border-color: var(--app-border);
            color: var(--app-text);
            vertical-align: middle;
        }

        /* Semantic Status Rows & Pills (Call Room & Schedule) */
        .table-success, tr.table-success > td {
            background-color: var(--app-success-soft) !important;
            color: var(--app-text) !important;
        }
        .table-warning, tr.table-warning > td {
            background-color: var(--app-warning-soft) !important;
            color: var(--app-text) !important;
        }
        .table-danger, tr.table-danger > td {
            background-color: var(--app-danger-soft) !important;
            color: var(--app-text) !important;
        }
        .table-info, tr.table-info > td {
            background-color: var(--app-info-soft) !important;
            color: var(--app-text) !important;
        }
        tr.table-success { border-left: 4px solid var(--app-success); }
        tr.table-warning { border-left: 4px solid var(--app-warning); }
        tr.table-danger  { border-left: 4px solid var(--app-danger); }
        tr.table-info    { border-left: 4px solid var(--app-info); }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .status-pill-success { background: var(--app-success-soft); color: var(--app-success-fg); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-pill-warning { background: var(--app-warning-soft); color: var(--app-warning-fg); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-pill-danger  { background: var(--app-danger-soft);  color: var(--app-danger-fg);  border: 1px solid rgba(244, 63, 94, 0.3); }
        .status-pill-info    { background: var(--app-info-soft);    color: var(--app-info-fg);    border: 1px solid rgba(14, 165, 233, 0.3); }
        .status-pill-neutral { background: rgba(148, 163, 184, 0.12); color: var(--app-muted); border: 1px solid var(--app-border); }

        /* Stadium Live Clock */
        .stadium-clock {
            background: #050811;
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 0.38rem 0.9rem;
            border-radius: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            box-shadow: inset 0 0 12px rgba(245, 158, 11, 0.12);
        }

        /* Lane Badge */
        .lane-badge {
            display: inline-flex;
            width: 26px;
            height: 26px;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            background-color: var(--app-surface-alt);
            border: 1px solid var(--app-border-strong);
            color: var(--app-text);
            font-variant-numeric: tabular-nums;
        }
        .lane-badge.pref-lane {
            background-color: var(--app-accent-soft);
            color: var(--app-accent-fg);
            border-color: rgba(245, 158, 11, 0.35);
        }

        /* Alerts & List Group */
        .alert {
            border-radius: 10px;
            background-color: var(--app-surface-alt);
            color: var(--app-text);
            border: 1px solid var(--app-border-strong);
        }
        .alert-warning {
            background-color: var(--app-warning-soft);
            color: var(--app-warning-fg);
            border-color: rgba(245, 158, 11, 0.35);
        }
        .alert-info {
            background-color: var(--app-info-soft);
            color: var(--app-info-fg);
            border-color: rgba(14, 165, 233, 0.35);
        }
        .list-group-item {
            background-color: var(--app-surface);
            color: var(--app-text);
            border-color: var(--app-border);
        }

        /* Page Header */
        .view-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 1rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--app-border);
        }
        .view-eyebrow {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--app-accent-fg);
            margin-bottom: 0.15rem;
        }
        .view-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--app-text);
        }

        /* Segmented Tabs (Notes & Dispositivo) */
        .seg-tabs {
            display: inline-flex;
            background-color: var(--app-surface);
            border: 1px solid var(--app-border);
            padding: 0.25rem;
            border-radius: 10px;
            gap: 0.25rem;
        }
        .seg-tab-btn {
            border: none;
            background: transparent;
            color: var(--app-muted);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.45rem 0.95rem;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .seg-tab-btn.active {
            background-color: var(--app-primary);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
        }

        .anomaly {
            background-color: var(--app-warning-soft) !important;
            font-weight: bold;
        }

        /* ==========================================================================
           GANTT CHART & MULTI-DAY TIMELINE STYLES
           ========================================================================== */
        .gantt-wrapper {
            background-color: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: var(--app-shadow);
        }
        .gantt-Grid {
            min-width: 780px;
        }
        .gantt-header-row {
            display: flex;
            background-color: var(--app-surface-alt);
            border-bottom: 1px solid var(--app-border-strong);
            font-size: 0.73rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--app-muted);
        }
        .gantt-label-col {
            width: 290px;
            min-width: 290px;
            max-width: 290px;
            padding: 0.65rem 0.9rem;
            border-right: 1px solid var(--app-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .gantt-timeline-col {
            flex: 1;
            position: relative;
            min-height: 48px;
        }
        .gantt-row {
            display: flex;
            border-bottom: 1px solid var(--app-border);
            transition: background-color 0.12s ease;
        }
        .gantt-row:last-child {
            border-bottom: none;
        }
        .gantt-row:hover {
            background-color: var(--app-surface-hover);
        }
        .gantt-tick {
            position: absolute;
            top: 0;
            bottom: 0;
            border-left: 1px dashed rgba(148, 163, 184, 0.18);
            font-size: 0.7rem;
            padding-left: 4px;
            padding-top: 8px;
            color: var(--app-muted);
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }
        .gantt-gridline {
            position: absolute;
            top: 0;
            bottom: 0;
            border-left: 1px dashed rgba(148, 163, 184, 0.12);
            pointer-events: none;
        }
        .gantt-bar {
            position: absolute;
            top: 9px;
            bottom: 9px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            padding: 0 0.55rem;
            font-size: 0.74rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            font-variant-numeric: tabular-nums;
            z-index: 2;
            min-width: 6px;
        }
        .gantt-bar-rettilineo {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: 1px solid #fbbf24;
        }
        .gantt-bar-anello {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: 1px solid #60a5fa;
        }
        .gantt-bar-salti {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid #34d399;
        }
        .gantt-bar-lanci {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            border: 1px solid #a78bfa;
        }
        .gantt-bar-overlap {
            box-shadow: 0 0 0 2px #f43f5e, 0 2px 8px rgba(244, 63, 94, 0.45) !important;
        }
        .gantt-end-tag {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--app-text);
            padding-left: 6px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            z-index: 3;
        }
        .sector-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.12rem 0.48rem;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .sector-rettilineo { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
        .sector-anello     { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35); }
        .sector-salti      { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
        .sector-lanci      { background: rgba(139, 92, 246, 0.18); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.35); }

        // 2. Initialization
        async function init() {
            if (window.__INJECTED_MEETING__) {
                const m = window.__INJECTED_MEETING__;
                let mId = "default";
                let rUrl = "";
                if (m.info && m.info.url) {
                    const match = m.info.url.match(/(REG\d+|COD\d+)/i);
                    if (match) mId = match[0].toUpperCase();
                    rUrl = m.info.url.replace('/Iscrizioni/IndexPerGara.html', '/Risultati/IndexRisultatiPerGara.html');
                }
                
                await db.meetings.put({
                    id: mId,
                    name: m.info ? m.info.name : "Meeting Senza Nome",
                    date: new Date().toISOString(),
                    data: m.races,
                    resultsUrl: rUrl
                });
                
                // Also init races
                for (const race of m.races) {
                    const raceId = mId + '_' + race.nome_gara;
                    const existing = await db.races.get(raceId);
                    if (!existing) {
                        await db.races.put({
                            id: raceId,
                            meetingId: mId,
                            name: race.nome_gara,
                            scheduledTime: '',
                            isCompleted: 0
                        });
                    }
                }
            }
            
            await loadMeetingList();
        }

        async function loadMeetingList() {
            const meetings = await db.meetings.toArray();
            const sel = document.getElementById('meeting-selector');
            sel.innerHTML = '';
            
            if (meetings.length === 0) {
                sel.innerHTML = '<option>Nessun meeting caricato</option>';
                document.getElementById('main-content').innerHTML = '<div class="alert alert-info mt-4">Genera un meeting usando lo script di scraping per iniziare.</div>';
                return;
            }
            
            // Sort by date desc
            meetings.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            meetings.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                sel.appendChild(opt);
            });
            
            // If injected, select it
            if (window.__INJECTED_MEETING__) {
                const url = window.__INJECTED_MEETING__.info.url || "";
                const match = url.match(/(REG\d+|COD\d+)/i);
                if (match) {
                    sel.value = match[0].toUpperCase();
                } else {
                    sel.value = "default";
                }
            }
            
            await switchMeeting();
        }

        async function switchMeeting() {
            const sel = document.getElementById('meeting-selector');
            if (!sel.value) return;
            
            currentMeeting = await db.meetings.get(sel.value);
            window.currentMeeting = currentMeeting;
            await buildSidebar();
            showOverview();
        }

        // Helpers
        function isFieldEvent(name) {
            const lower = name.toLowerCase();
            return ['salto', 'lungo', 'alto', 'asta', 'triplo', 'peso', 'disco', 'martello', 'maniglia', 'giavellotto', 'vortex', 'palla', 'lancio', 'lanci'].some(k => lower.includes(k));
        }
        function isThrowEvent(name) {
            const lower = name.toLowerCase();
            return ['peso', 'disco', 'martello', 'maniglia', 'giavellotto', 'vortex', 'palla', 'lancio', 'lanci'].some(k => lower.includes(k));
        }
        function isTripleJump(name) {
            return name.toLowerCase().includes('triplo');
        }
        function isHighJump(name) {
            return /\balto\b/i.test(name);
        }
        function isPoleVault(name) {
            return /\basta\b/i.test(name);
        }
        function isVerticalJump(name) {
            return isHighJump(name) || isPoleVault(name);
        }
        function isStraightTrack(name) {
            if (isFieldEvent(name)) return false;
            return /(?:^|\b)(50|60|80|100|110)\s*(?:m|metri|hs|h\b)/i.test(name) && !/4x|staffetta|1000/i.test(name);
        }
        function getTrackSector(name) {
            if (isFieldEvent(name)) {
                return isThrowEvent(name) ? 'lanci' : 'salti';
            }
            return isStraightTrack(name) ? 'rettilineo' : 'anello';
        }
        function getSectorLabel(sector) {
            if (sector === 'rettilineo') return '⚡ Rettilineo';
            if (sector === 'anello') return '🔄 Anello';
            if (sector === 'salti') return '🦘 Salti';
            return '🥏 Lanci';
        }
        function getFieldConfig(index) {
            const raw = localStorage.getItem('field_data_' + currentMeeting.id + '_' + index);
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return { numGroups: 1, method: 'inverse', progression: '', battuta1: '', battuta2: '', groups: null };
        }
        function saveFieldConfig(index, updates) {
            const current = getFieldConfig(index);
            const updated = Object.assign({}, current, updates);
            localStorage.setItem('field_data_' + currentMeeting.id + '_' + index, JSON.stringify(updated));
            return updated;
        }
        window.saveTripleJumpBoard = function(index, boardNum, val) {
            const cleanVal = (val || '').trim();
            const updates = boardNum === 1 ? { battuta1: cleanVal } : { battuta2: cleanVal };
            const updated = saveFieldConfig(index, updates);
            
            // Update print badge in Overview if visible
            const badgeEl = document.getElementById('tj-print-badge-' + index);
            if (badgeEl) {
                const boards = [updated.battuta1, updated.battuta2].filter(Boolean);
                if (boards.length > 0) {
                    badgeEl.textContent = '📐 Battute: ' + boards.join(' / ');
                    badgeEl.classList.remove('d-none');
                } else {
                    badgeEl.textContent = '';
                    badgeEl.classList.add('d-none');
                }
            }
            // If currently on the race page and start list is generated, refresh it
            if (activeRaceIndex === index && document.getElementById('results-' + index) && document.getElementById('results-' + index).innerHTML.trim() !== '') {
                generateField(index);
            }
        };
        window.saveProgressionConfig = function(index, val) {
            const cleanVal = (val || '').trim();
            saveFieldConfig(index, { progression: cleanVal });
            const badgeEl = document.getElementById('prog-print-badge-' + index);
            if (badgeEl) {
                if (cleanVal) {
                    badgeEl.textContent = '📏 Progressione: ' + cleanVal;
                    badgeEl.classList.remove('d-none');
                } else {
                    badgeEl.textContent = '';
                    badgeEl.classList.add('d-none');
                }
            }
            if (activeRaceIndex === index && document.getElementById('results-' + index) && document.getElementById('results-' + index).innerHTML.trim() !== '') {
                generateField(index);
            }
        };
        function isMiddleDistance(name) {
            const lower = name.toLowerCase();
            return ['600', '800', '1000', '1200', '1500', 'miglio', '2000', '3000', 'siepi', '5000', '10000', 'marcia'].some(k => lower.includes(k));
        }
        function getMinutesPerHeat(nomeGara) {
            const lower = nomeGara.toLowerCase();
            if (lower.includes('10000') || lower.includes('marcia 10')) return 40;
            if (lower.includes('5000') || lower.includes('marcia 5')) return 22;
            if (lower.includes('3000') || lower.includes('siepi')) return 15;
            if (lower.includes('1500') || lower.includes('miglio')) return 8;
            if (lower.includes('800') || lower.includes('1000')) return 6;
            if (lower.includes('400')) return 5;
            return 4;
        }
        function estimateDuration(nomeGara, iscrittiCount, isMiddle, heatsCount, customInterval) {
            if (isFieldEvent(nomeGara)) {
                if (isPoleVault(nomeGara)) return iscrittiCount * 3 + 15;
                if (isHighJump(nomeGara)) return iscrittiCount * 2 + 10;
                return Math.ceil(iscrittiCount * 1.5) + 15;
            }
            let assumedHeats = heatsCount || Math.ceil(iscrittiCount / (isMiddle ? 12 : 6));
            const minsPerHeat = customInterval ? parseInt(customInterval) : getMinutesPerHeat(nomeGara);
            return assumedHeats * minsPerHeat;
        }

        // Sidebar
        async function buildSidebar() {
            const list = document.getElementById('race-list');
            list.innerHTML = '';
            if (!currentMeeting || !currentMeeting.data) return;

            const racesDb = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const compMap = {};
            racesDb.forEach(r => { compMap[r.name] = r.isCompleted; });
            
            const groups = { 'Corse': [], 'Salti': [], 'Lanci': [] };
            currentMeeting.data.forEach((race, index) => {
                let cat = 'Corse';
                if (isFieldEvent(race.nome_gara)) {
                    cat = isThrowEvent(race.nome_gara) ? 'Lanci' : 'Salti';
                }
                groups[cat].push({race, index});
            });

        window.renderGanttChart = async function() {
            const container = document.getElementById('gantt-chart-container');
            const banner = document.getElementById('gantt-status-banner');
            if (!container || !currentMeeting) return;

            const racesDb = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const dbMap = {};
            const dayCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
            racesDb.forEach(r => {
                dbMap[r.name] = r;
                const d = r.day || 1;
                if (r.scheduledTime) dayCounts[d] = (dayCounts[d] || 0) + 1;
            });

            // Update day pill labels with counts
            document.querySelectorAll('.gantt-day-pill').forEach((btn, idx) => {
                if (idx < 4) {
                    const dNum = idx + 1;
                    btn.textContent = `Giorno ${dNum} (${dayCounts[dNum] || 0})`;
                }
            });

            const items = [];
            currentMeeting.data.forEach((r, index) => {
                const rec = dbMap[r.nome_gara] || {};
                const day = rec.day || 1;
                const schedTime = rec.scheduledTime || '';
                const field = isFieldEvent(r.nome_gara);
                const isMiddle = isMiddleDistance(r.nome_gara);
                let confHeats = null, confInterval = null;
                if (!field) {
                    const savedTrack = localStorage.getItem('race_data_' + currentMeeting.id + '_' + index);
                    if (savedTrack) {
                        try {
                            const td = JSON.parse(savedTrack);
                            if (td.heats) confHeats = td.heats.length;
                            if (td.heatInterval) confInterval = td.heatInterval;
                        } catch(e) {}
                    }
                }
                const duration = Math.max(5, Math.round(estimateDuration(r.nome_gara, r.numero_iscritti, isMiddle, confHeats, confInterval)));
                const sector = getTrackSector(r.nome_gara);

                let startMins = null;
                let endMins = null;
                if (schedTime && schedTime.includes(':')) {
                    const [hh, mm] = schedTime.split(':').map(Number);
                    startMins = hh * 60 + mm;
                    endMins = startMins + duration;
                }

                items.push({
                    index,
                    name: r.nome_gara,
                    iscritti: r.numero_iscritti,
                    day,
                    schedTime,
                    startMins,
                    endMins,
                    duration,
                    sector,
                    isCompleted: !!rec.isCompleted
                });
            });

            // Filter by day and sector
            const filtered = items.filter(it => {
                const matchDay = currentGanttDay === 'all' || String(it.day) === String(currentGanttDay);
                const matchSec = currentGanttSector === 'all' || it.sector === currentGanttSector;
                return matchDay && matchSec;
            });

            const scheduled = filtered.filter(it => it.startMins !== null).sort((a, b) => (a.day - b.day) || (a.startMins - b.startMins));
            const unscheduled = filtered.filter(it => it.startMins === null);

            // Detect Rettilineo windows & same-sector overlaps per day
            const overlapIds = new Set();
            const rettilineoWindows = [];
            scheduled.forEach((a, i) => {
                if (a.sector === 'rettilineo') {
                    rettilineoWindows.push({ day: a.day, name: a.name.replace(/\s*-\s*Lista Partecipanti/i, ''), start: a.startMins, end: a.endMins });
                }
                for (let j = i + 1; j < scheduled.length; j++) {
                    const b = scheduled[j];
                    if (a.day === b.day && a.sector === b.sector && (a.sector === 'rettilineo' || a.sector === 'anello')) {
                        if (a.startMins < b.endMins && b.startMins < a.endMins) {
                            overlapIds.add(a.index);
                            overlapIds.add(b.index);
                        }
                    }
                }
            });

            if (banner) {
                let bannerHtml = '';
                if (rettilineoWindows.length > 0) {
                    const winStrs = rettilineoWindows.map(w => `<strong>${formatMinsToTime(w.start)} → ${formatMinsToTime(w.end)}</strong> (${w.name})`).join(' · ');
                    const lastFree = formatMinsToTime(Math.max(...rettilineoWindows.map(w => w.end)));
                    bannerHtml += `
                        <div class="alert alert-info py-2 px-3 mb-3 small d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div>⚡ <strong>Occupazione Rettilineo (Sprint/Ostacoli):</strong> ${winStrs}</div>
                            <span class="status-pill status-pill-success">✅ Rettilineo libero dalle ${lastFree}</span>
                        </div>
                    `;
                }

                    bannerHtml += `
                        <div class="alert alert-warning py-2 px-3 mb-3 small">

                        </div>
                    `;
                }
                banner.innerHTML = bannerHtml;
            }

            if (scheduled.length === 0) {
                container.innerHTML = `
                    <div class="card p-4 text-center">
                        <h5 class="fw-bold mb-2">Nessuna gara con orario assegnato in questa selezione</h5>
                        <p class="text-muted small mb-0">Assegna l'orario e la giornata alle gare qui sotto o nella <a href="#" onclick="showOverview(); return false;">Panoramica Meeting</a> per visualizzare il grafico Gantt.</p>
                    </div>
                `;
            } else {
                // Group by day if 'all' is selected, otherwise single day block
                const daysToRender = currentGanttDay === 'all'
                    ? [...new Set(scheduled.map(s => s.day))].sort((a, b) => a - b)
                    : [parseInt(currentGanttDay)];

                let ganttHtml = '';
                daysToRender.forEach(dNum => {
                    const dayItems = scheduled.filter(s => s.day === dNum);
                    if (dayItems.length === 0) return;

                    const minStart = Math.floor(Math.min(...dayItems.map(s => s.startMins)) / 15) * 15 - 15;
                    const maxEnd = Math.ceil(Math.max(...dayItems.map(s => s.endMins)) / 15) * 15 + 30;
                    const totalSpan = Math.max(60, maxEnd - minStart);
                    const stepMins = totalSpan > 240 ? 30 : 15;

                    let ticksHtml = '';
                    let gridlinesHtml = '';
                    for (let t = minStart; t <= maxEnd; t += stepMins) {
                        const leftPct = ((t - minStart) / totalSpan) * 100;
                        if (leftPct >= 0 && leftPct <= 98) {
                            ticksHtml += `<div class="gantt-tick" style="left: ${leftPct.toFixed(2)}%;">${formatMinsToTime(t)}</div>`;
                            gridlinesHtml += `<div class="gantt-gridline" style="left: ${leftPct.toFixed(2)}%;"></div>`;
                        }
                    }

                    ganttHtml += `
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="fw-bold mb-0">🗓️ Giorno ${dNum} — Evoluzione Oraria (${dayItems.length} gare programmate: ${formatMinsToTime(minStart + 15)} ÷ ${formatMinsToTime(maxEnd - 30)})</h5>

                                    <span class="sector-badge sector-rettilineo">⚡ Rettilineo</span>
                                    <span class="sector-badge sector-anello">🔄 Anello</span>

                                    <span class="sector-badge sector-lanci">🥏 Lanci</span>
                                </div>
                            </div>
                            <div class="gantt-wrapper">
                                <div class="gantt-Grid">
                                    <div class="gantt-header-row">
                                        <div class="gantt-label-col">Gara / Settore / Inizio → Fine</div>
                                        <div class="gantt-timeline-col" style="min-height: 34px;">
                                            ${ticksHtml}
                                        </div>
                                    </div>
                    `;

                    dayItems.forEach(it => {
                        const leftPct = Math.max(0, ((it.startMins - minStart) / totalSpan) * 100);
                        const widthPct = Math.max(1.5, Math.min(100 - leftPct, (it.duration / totalSpan) * 100));
                        const startStr = formatMinsToTime(it.startMins);
                        const endStr = formatMinsToTime(it.endMins);
                        const cleanName = it.name.replace(/\s*-\s*Lista Partecipanti/i, '');
                        const isOv = overlapIds.has(it.index);

                        ganttHtml += `
                            <div class="gantt-row" data-race-index="${it.index}">
                                <div class="gantt-label-col">
                                    <div class="d-flex justify-content-between align-items-center gap-1">
                                        <a href="#" onclick="showRace(${it.index}, null); return false;" class="fw-bold text-truncate text-decoration-none" style="color: var(--app-text); font-size: 0.84rem;" title="${it.name}">${cleanName}</a>
                                        <span class="sector-badge sector-${it.sector}">${getSectorLabel(it.sector)}</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mt-1 small text-muted tabular-nums" style="font-size: 0.74rem;">
                                        <span>🕒 <strong>${startStr} → ${endStr}</strong> (${it.duration}')</span>
                                        <span>${it.iscritti} atl.</span>
                                    </div>
                                </div>
                                <div class="gantt-timeline-col">
                                    ${gridlinesHtml}
                                    <div class="gantt-bar gantt-bar-${it.sector} ${isOv ? 'gantt-bar-overlap' : ''}" style="left: ${leftPct.toFixed(2)}%; width: ${widthPct.toFixed(2)}%;" title="${cleanName}: ${startStr} → ${endStr} (${it.duration} min)">
                                        ${startStr} → ${endStr} (${it.duration}')
                                    </div>
                                    <span class="gantt-end-tag" style="left: ${(leftPct + widthPct).toFixed(2)}%;">Fine ${endStr}</span>
                                </div>
                            </div>
                        `;
                    });

                    ganttHtml += `</div></div></div>`;
                });

                container.innerHTML = ganttHtml;
            }

            // Also show quick scheduling table for unscheduled races if any
            if (unscheduled.length > 0) {
                let unschedHtml = `
                    <div class="card mt-4 d-print-none">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>⏱ Gare da Pianificare (${unscheduled.length} senza orario) — Assegna Giorno e Orario per aggiungerle al Gantt</span>

                unscheduled.forEach(u => {

                            <td class="tabular-nums">${u.duration} min</td>
                        </tr>
                    `;
                });
                unschedHtml += `</tbody></table></div></div>`;
                container.insertAdjacentHTML('beforeend', unschedHtml);
            }
        };

                }
            </style>
            </head><body>

            if (verticalItems.length > 0) {
                phtml += `

            phtml += `

                    <div class="signature-block row justify-content-end">

                            <h5 class="fw-bold text-dark mb-4">${tdName || '___________________________________'}</h5>

                <script>
                    function downloadPdfFile() {
                        const element = document.getElementById('dispositivo-content');
                        if (window.html2pdf) {
                            const opt = {

                                filename: '${safeFileName}',

            const win = window.open('', '_blank');
            win.document.write(phtml);
            win.document.close();
        };

        let activeCallRoomDay = 0;

        async function showCallRoom() {
            clearActiveNav();
            activeRaceIndex = null;
            document.getElementById('nav-callroom')?.classList.add('active');
            
            // Get offsets or set defaults
            const getOff = (k, def) => parseInt(localStorage.getItem(k) || def);
            
            const offsets = {
                corse: { cr1: getOff('cr1_corse', 30), cr2: getOff('cr2_corse', 20), track: getOff('track_corse', 10) },
                concorsi: { cr1: getOff('cr1_concorsi', 45), cr2: getOff('cr2_concorsi', 30), track: getOff('track_concorsi', 20) },
                alto: { cr1: getOff('cr1_alto', 50), cr2: getOff('cr2_alto', 35), track: getOff('track_alto', 30) },
                asta: { cr1: getOff('cr1_asta', 60), cr2: getOff('cr2_asta', 45), track: getOff('track_asta', 40) }
            };
            
            document.getElementById('main-content').innerHTML = `
                <div class="view-header">
                    <div>
                        <div class="view-eyebrow">Monitoraggio Sincronizzato per Serie, Pedana & Giornata</div>
                        <h2 class="view-title">🕒 Call Room Live Dashboard</h2>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-2 d-print-none">
                        <span id="live-clock" class="stadium-clock">--:--:--</span>
                        <button class="btn btn-outline-secondary btn-sm fw-semibold" onclick="toggleCallRoomSettings()">⚙️ Offset Tempi</button>
                        <button class="btn btn-outline-secondary btn-sm fw-semibold" onclick="window.print()">🖨️ Stampa Tabellone</button>
                        <button class="btn btn-primary btn-sm fw-bold" onclick="syncWise()">🔄 Sincronizza WISE</button>
                    </div>
                </div>

                <div class="filter-bar mb-3 d-print-none">
                    <span class="small fw-bold text-muted me-1">📅 Giornata:</span>
                    <button type="button" class="filter-pill ${activeCallRoomDay === 0 ? 'active' : ''}" onclick="setCallRoomDay(0, this)">Tutte le Giornate</button>
                    <button type="button" class="filter-pill ${activeCallRoomDay === 1 ? 'active' : ''}" onclick="setCallRoomDay(1, this)">Giorno 1</button>
                    <button type="button" class="filter-pill ${activeCallRoomDay === 2 ? 'active' : ''}" onclick="setCallRoomDay(2, this)">Giorno 2</button>
                    <button type="button" class="filter-pill ${activeCallRoomDay === 3 ? 'active' : ''}" onclick="setCallRoomDay(3, this)">Giorno 3</button>
                    <button type="button" class="filter-pill ${activeCallRoomDay === 4 ? 'active' : ''}" onclick="setCallRoomDay(4, this)">Giorno 4</button>
                </div>
                
                <div class="card mb-4 d-print-none d-none" id="cr-settings-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>⚙️ Impostazioni Tempi Call Room (Minuti prima della gara)</span>
                        <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="toggleCallRoomSettings()">Chiudi ✕</button>
                    </div>
                    <div class="card-body">
                        <div class="row text-center fw-bold small mb-2 text-muted">
                            <div class="col-md-3 text-start">Categoria</div>
                            <div class="col-md-3">CR 1 (Apertura)</div>
                            <div class="col-md-3">CR 2 (Uscita)</div>
                            <div class="col-md-3">Ingresso in Pista</div>
                        </div>
                        
                        <div class="row align-items-center mb-2">
                            <div class="col-md-3 text-start fw-bold">Corse</div>
                            <div class="col-md-3"><input type="number" id="cr1-corse" class="form-control form-control-sm tabular-nums" value="${offsets.corse.cr1}"></div>
                            <div class="col-md-3"><input type="number" id="cr2-corse" class="form-control form-control-sm tabular-nums" value="${offsets.corse.cr2}"></div>
                            <div class="col-md-3"><input type="number" id="track-corse" class="form-control form-control-sm tabular-nums" value="${offsets.corse.track}"></div>
                        </div>
                        
                        <div class="row align-items-center mb-2">
                            <div class="col-md-3 text-start fw-bold">Concorsi (Lanci/Estensione)</div>
                            <div class="col-md-3"><input type="number" id="cr1-concorsi" class="form-control form-control-sm tabular-nums" value="${offsets.concorsi.cr1}"></div>
                            <div class="col-md-3"><input type="number" id="cr2-concorsi" class="form-control form-control-sm tabular-nums" value="${offsets.concorsi.cr2}"></div>
                            <div class="col-md-3"><input type="number" id="track-concorsi" class="form-control form-control-sm tabular-nums" value="${offsets.concorsi.track}"></div>
                        </div>
                        
                        <div class="row align-items-center mb-2">
                            <div class="col-md-3 text-start fw-bold">Salto in Alto</div>
                            <div class="col-md-3"><input type="number" id="cr1-alto" class="form-control form-control-sm tabular-nums" value="${offsets.alto.cr1}"></div>
                            <div class="col-md-3"><input type="number" id="cr2-alto" class="form-control form-control-sm tabular-nums" value="${offsets.alto.cr2}"></div>
                            <div class="col-md-3"><input type="number" id="track-alto" class="form-control form-control-sm tabular-nums" value="${offsets.alto.track}"></div>
                        </div>
                        
                        <div class="row align-items-center mb-3">
                            <div class="col-md-3 text-start fw-bold">Salto con l'Asta</div>
                            <div class="col-md-3"><input type="number" id="cr1-asta" class="form-control form-control-sm tabular-nums" value="${offsets.asta.cr1}"></div>
                            <div class="col-md-3"><input type="number" id="cr2-asta" class="form-control form-control-sm tabular-nums" value="${offsets.asta.cr2}"></div>
                            <div class="col-md-3"><input type="number" id="track-asta" class="form-control form-control-sm tabular-nums" value="${offsets.asta.track}"></div>
                        </div>
                        
                        <div class="text-end">
                            <button class="btn btn-primary btn-sm fw-semibold" onclick="saveCallRoomSettings()">💾 Salva Parametri</button>

                    </div>
                </div>

                <!-- Live Status Summary Strip -->
                <div class="row g-3 mb-4 d-print-none" id="cr-summary-strip"></div>
                
                <div id="cr-table-container"></div>
            `;
            
            renderCallRoomTable();
            callRoomTimer = setInterval(() => {
                const clk = document.getElementById('live-clock');
                if (clk) clk.textContent = new Date().toLocaleTimeString('it-IT');
                renderCallRoomTable();
            }, 10000);
            document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('it-IT');
        }

        window.toggleCallRoomSettings = function() {
            const card = document.getElementById('cr-settings-card');
            if (card) card.classList.toggle('d-none');
        };

        window.setCallRoomDay = function(day, btn) {
            activeCallRoomDay = day;
            if (btn && btn.parentElement) {
                btn.parentElement.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            renderCallRoomTable();
        };

        window.saveCallRoomSettings = function() {
            const types = ['corse', 'concorsi', 'alto', 'asta'];
            types.forEach(t => {
                localStorage.setItem(`cr1_${t}`, document.getElementById(`cr1-${t}`).value);
                localStorage.setItem(`cr2_${t}`, document.getElementById(`cr2-${t}`).value);
                localStorage.setItem(`track_${t}`, document.getElementById(`track-${t}`).value);
            });
            renderCallRoomTable();
        }

        function formatMinsToTime(totalMins) {
            let mins = totalMins % 1440;
            if (mins < 0) mins += 1440;
            const hh = Math.floor(mins / 60).toString().padStart(2, '0');
            const mm = (mins % 60).toString().padStart(2, '0');
            return hh + ':' + mm;
        }

        async function renderCallRoomTable() {
            const container = document.getElementById('cr-table-container');
            if (!container) return;
            
            const getOff = (k, def) => parseInt(localStorage.getItem(k) || def);
            const offsets = {
                corse: { cr1: getOff('cr1_corse', 30), cr2: getOff('cr2_corse', 20), track: getOff('track_corse', 10) },
                concorsi: { cr1: getOff('cr1_concorsi', 45), cr2: getOff('cr2_concorsi', 30), track: getOff('track_concorsi', 20) },
                alto: { cr1: getOff('cr1_alto', 50), cr2: getOff('cr2_alto', 35), track: getOff('track_alto', 30) },
                asta: { cr1: getOff('cr1_asta', 60), cr2: getOff('cr2_asta', 45), track: getOff('track_asta', 40) }
            };
            
            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const now = new Date();
            const nowMins = now.getHours() * 60 + now.getMinutes();
            
            let rowsData = [];
            
            races.forEach(r => {
                if (!r.scheduledTime) return; // Skip races without time
                if (r.isCompleted) return; // Skip completed
                const raceDay = parseInt(r.day) || 1;
                if (activeCallRoomDay > 0 && raceDay !== activeCallRoomDay) return;
                
                const [h, m] = r.scheduledTime.split(':').map(Number);
                const baseRaceMins = h * 60 + m;
                const dayBadge = `<span class="status-pill status-pill-neutral me-1" title="Giornata ${raceDay}">G${raceDay}</span>`;
                
                let cat = 'corse';
                const lower = r.name.toLowerCase();
                if (isPoleVault(r.name)) cat = 'asta';
                else if (isHighJump(r.name)) cat = 'alto';
                else if (['salto', 'lungo', 'triplo', 'peso', 'disco', 'martello', 'maniglia', 'giavellotto', 'vortex', 'palla', 'lancio', 'lanci'].some(k => lower.includes(k))) cat = 'concorsi';
                
                const o = offsets[cat];
                const raceIndex = currentMeeting.data.findIndex(d => d.nome_gara === r.name);
                const raceObj = raceIndex > -1 ? currentMeeting.data[raceIndex] : null;
                
                if (cat === 'corse' && raceObj && raceObj.numero_iscritti > 0) {
                    const savedTrackStr = localStorage.getItem('race_data_' + currentMeeting.id + '_' + raceIndex);
                    let heatsCount = 1;
                    let heatInterval = getMinutesPerHeat(r.name);
                    let heatAthletes = [];
                    let isConfigured = false;
                    
                    if (savedTrackStr) {
                        try {
                            const rd = JSON.parse(savedTrackStr);
                            if (rd.heats && rd.heats.length > 0) {
                                heatsCount = rd.heats.length;
                                heatAthletes = rd.heats.map(h => h.length);
                                isConfigured = true;
                            }
                            if (rd.heatInterval) heatInterval = parseInt(rd.heatInterval) || heatInterval;
                        } catch(e) {}
                    } else {
                        const isMid = isMiddleDistance(r.name);
                        const defLanes = isMid ? 12 : 6;
                        heatsCount = Math.max(1, Math.ceil(raceObj.numero_iscritti / defLanes));
                    }
                    
                    for (let i = 0; i < heatsCount; i++) {
                        const heatRaceMins = baseRaceMins + (i * heatInterval);
                        const subLabel = heatsCount > 1
                            ? `<span class="status-pill status-pill-info ms-2">Serie ${i+1}/${heatsCount}</span>`
                            : (isConfigured ? `<span class="status-pill status-pill-neutral ms-2">Serie Unica</span>` : '');
                        const athInfo = heatAthletes[i] !== undefined
                            ? `<small class="text-muted ms-1">(${heatAthletes[i]} atl.)</small>`
                            : (heatsCount > 1 ? `<small class="text-muted ms-1">(stima)</small>` : `<small class="text-muted ms-1">(${raceObj.numero_iscritti} atl.)</small>`);
                        
                        const isLastHeat = (i === heatsCount - 1);
                        const doneBtn = isLastHeat
                            ? `<button type="button" class="btn btn-sm btn-outline-success py-0 px-2 ms-2 d-print-none" title="Segna gara come conclusa" onclick="toggleRaceCompleted(\`${r.name.replace(/'/g, '&apos;')}\`, 1)">✓ Fine</button>`
                            : '';
                        rowsData.push({
                            raceDay,
                            raceMins: heatRaceMins,
                            timeStr: formatMinsToTime(heatRaceMins),
                            subTimeNote: heatsCount > 1 ? `Serie ${i+1} (+${i * heatInterval}')` : '',
                            nameHtml: `${dayBadge}<a href="#" onclick="showRace(${raceIndex}, null); return false;" class="text-decoration-none fw-bold" style="color: var(--app-text);">${r.name}</a> ${subLabel} ${athInfo}${doneBtn}`,
                            o
                        });
                    }
                } else {
                    let groupBadge = '';
                    if (raceIndex > -1) {
                        const savedFieldStr = localStorage.getItem('field_data_' + currentMeeting.id + '_' + raceIndex);
                        if (savedFieldStr) {
                            try {
                                const fd = JSON.parse(savedFieldStr);
                                if (fd.numGroups && fd.numGroups > 1) {
                                    groupBadge = `<span class="status-pill status-pill-info ms-2">${fd.numGroups} Gruppi (A-${String.fromCharCode(64 + fd.numGroups)})</span>`;
                                }
                            } catch(e) {}
                        }
                    }
                    const doneBtn = `<button type="button" class="btn btn-sm btn-outline-success py-0 px-2 ms-2 d-print-none" title="Segna gara come conclusa" onclick="toggleRaceCompleted(\`${r.name.replace(/'/g, '&apos;')}\`, 1)">✓ Fine</button>`;
                    rowsData.push({
                        raceDay,
                        raceMins: baseRaceMins,
                        timeStr: r.scheduledTime,
                        subTimeNote: '',
                        nameHtml: raceIndex > -1
                            ? `${dayBadge}<a href="#" onclick="showRace(${raceIndex}, null); return false;" class="text-decoration-none fw-bold" style="color: var(--app-text);">${r.name}</a> ${groupBadge}${doneBtn}`
                            : `${dayBadge}<span class="fw-bold">${r.name}</span>${doneBtn}`,
                        o
                    });
                }
            });
            
            rowsData.sort((a, b) => (a.raceDay !== b.raceDay ? a.raceDay - b.raceDay : a.raceMins - b.raceMins));

            let cntCr1 = 0, cntCr2 = 0, cntTrack = 0, cntLive = 0;
            
            let html = '<div class="table-container-card"><table class="table text-center align-middle tabular-nums"><thead class="table-dark"><tr><th>Orario Gara</th><th class="text-start">Gara / Serie</th><th>Apertura CR1</th><th>Apertura CR2</th><th>Ingresso Pista</th><th>Stato Live</th></tr></thead><tbody>';
            
            if (rowsData.length === 0) {
                html += `<tr><td colspan="6" class="py-4 text-muted">Nessuna gara con orario programmato. Inserisci gli orari nella <a href="#" onclick="showOverview(); return false;">Panoramica Meeting</a> per attivare il tabellone Call Room Live.</td></tr>`;
            }

            rowsData.forEach(item => {
                const { raceMins, timeStr, subTimeNote, nameHtml, o } = item;
                const cr1Mins = raceMins - o.cr1;
                const cr2Mins = raceMins - o.cr2;
                const trackMins = raceMins - o.track;
                
                let rowClass = "";
                let statoBadge = `<span class="status-pill status-pill-neutral">IN ATTESA</span>`;
                
                if (nowMins >= raceMins) {
                    rowClass = "table-success";
                    statoBadge = `<span class="status-pill status-pill-success">● IN CORSO</span>`;
                    cntLive++;
                } else if (nowMins >= trackMins) {
                    rowClass = "table-warning";
                    statoBadge = `<span class="status-pill status-pill-warning">IN PISTA</span>`;
                    cntTrack++;
                } else if (nowMins >= cr2Mins) {
                    rowClass = "table-danger";
                    statoBadge = `<span class="status-pill status-pill-danger">IN CR 2</span>`;
                    cntCr2++;
                } else if (nowMins >= cr1Mins) {
                    rowClass = "table-info";
                    statoBadge = `<span class="status-pill status-pill-info">IN CR 1</span>`;
                    cntCr1++;
                }
                
                html += `<tr class="${rowClass}">
                    <td class="fw-bold fs-5">${timeStr}${subTimeNote ? `<br><small class="text-muted fw-normal" style="font-size:0.75rem;">${subTimeNote}</small>` : ''}</td>
                    <td class="text-start">${nameHtml}</td>
                    <td><strong>${formatMinsToTime(cr1Mins)}</strong> <br><small class="text-muted">(-${o.cr1}')</small></td>
                    <td><strong>${formatMinsToTime(cr2Mins)}</strong> <br><small class="text-muted">(-${o.cr2}')</small></td>
                    <td><strong>${formatMinsToTime(trackMins)}</strong> <br><small class="text-muted">(-${o.track}')</small></td>

            const file = input.files && input.files[0];

            const reader = new FileReader();
            reader.onload = async (ev) => {

        window.parseWiseContentAndSync = async function() {
            const ta = document.getElementById('wise-paste-input');
            const fb = document.getElementById('wise-sync-feedback');
            if (!ta || !currentMeeting) return;
            const raw = ta.value.trim();
            if (!raw) {
                if (fb) {
                    fb.className = 'alert alert-warning py-2 px-3 mb-3 small fw-bold';
                    fb.textContent = '⚠️ Incolla prima il testo (Ctrl+A / Ctrl+C) o il codice HTML copiato dalla pagina risultati FIDAL.';
                }
                return;
            }

            // Extract candidate strings from HTML links/cells AND plain text lines
            const candidates = [];
            if (raw.includes('<a') || raw.includes('<table') || raw.includes('<html')) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(raw, 'text/html');
                doc.querySelectorAll('a, td, li, h3, h4').forEach(el => {
                    const t = (el.textContent || '').trim();
                    if (t.length >= 4) candidates.push(t);
                });
            }
            raw.split(/[\r\n\t]+/).forEach(line => {
                const t = line.trim();
                if (t.length >= 4) candidates.push(t);
            });

            const normCandidates = candidates.map(c => cleanRaceBaseName(c)).filter(c => c.length >= 4);
            const fullRawNorm = raw.replace(/\s+/g, ' ').toLowerCase();

            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            let newlyCompleted = [];
            let alreadyCompleted = 0;

            for (const r of races) {
                const baseName = cleanRaceBaseName(r.name);
                if (!baseName || baseName.length < 3) continue;

                const matched = normCandidates.some(c => c === baseName || c.includes(baseName) || (baseName.includes(c) && c.length >= 6))
                    || fullRawNorm.includes(baseName);

                if (matched) {
                    if (!r.isCompleted) {
                        r.isCompleted = 1;
                        await db.races.put(r);
                        newlyCompleted.push(r.name.replace(/\s*-\s*Lista Partecipanti/i, ''));
                    } else {
                        alreadyCompleted++;
                    }
                }
            }

            await buildSidebar();
            await renderWiseChecklist();

            if (fb) {
                if (newlyCompleted.length > 0) {
                    fb.className = 'alert alert-success py-2 px-3 mb-3 small fw-bold';
                    fb.innerHTML = `✅ Sincronizzazione completata! <strong>${newlyCompleted.length} nuove gare segnate come concluse:</strong> ${newlyCompleted.join(', ')}${alreadyCompleted ? ` (${alreadyCompleted} erano già concluse)` : ''}.`;
                } else if (alreadyCompleted > 0) {
                    fb.className = 'alert alert-info py-2 px-3 mb-3 small fw-bold';
                    fb.innerHTML = `ℹ️ Tutte le <strong>${alreadyCompleted} gare</strong> presenti nel testo incollato risultavano già segnate come concluse.`;
                } else {
                    fb.className = 'alert alert-warning py-2 px-3 mb-3 small fw-bold';
                    fb.innerHTML = `⚠️ Nessuna corrispondenza trovata nel testo incollato. Assicurati di aver copiato l'elenco gare dalla pagina Risultati FIDAL oppure usa la spunta rapida 1-Click qui sotto.`;
                }
            }
        };

        window.markPastRacesCompleted = async function() {
            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const now = new Date();
            const nowMins = now.getHours() * 60 + now.getMinutes();
            let count = 0;

            for (const r of races) {
                if (r.isCompleted || !r.scheduledTime || !r.scheduledTime.includes(':')) continue;
                const [hh, mm] = r.scheduledTime.split(':').map(Number);
                const raceObj = currentMeeting.data.find(d => d.nome_gara === r.name);
                const dur = raceObj ? Math.round(estimateDuration(raceObj.nome_gara, raceObj.numero_iscritti, isMiddleDistance(raceObj.nome_gara))) : 15;
                if (nowMins >= (hh * 60 + mm + dur)) {
                    r.isCompleted = 1;
                    await db.races.put(r);
                    count++;
                }
            }
            await buildSidebar();
            await renderWiseChecklist();
            const fb = document.getElementById('wise-sync-feedback');
            if (fb) {
                fb.className = 'alert alert-info py-2 px-3 mb-3 small fw-bold';
                fb.textContent = count > 0
                    ? `⏱ ${count} gare con orario di fine superato sono state segnate come concluse.`
                    : `ℹ️ Nessuna gara attiva ha ancora superato il proprio orario di fine stimata (${now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}).`;
            }
        };

function timeToSeconds(t) {
            if (!t) return 999999;
            t = t.trim();
            if (t.includes(':')) {
                const parts = t.split(':');
                return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
            return parseFloat(t) || 999999;
        }



        function validateProgression(inputElement, raceName) {
            const feedback = inputElement.nextElementSibling;
            const str = inputElement.value.replace(/,/g, ' ').trim();
            if (!str) {
                feedback.innerHTML = "Inserisci le misure separate da spazio o virgola. Saranno stampate sul foglio gara.";
                feedback.className = "form-text text-muted";
                inputElement.classList.remove('is-invalid', 'is-valid');
                return;
            }
            
            const measures = str.split(/\s+/).map(x => parseFloat(x));
            if (measures.some(isNaN)) {
                feedback.innerHTML = "Formato non valido. Inserisci solo numeri (es. 1.80 1.85).";
                feedback.className = "form-text text-danger";
                inputElement.classList.add('is-invalid');
                inputElement.classList.remove('is-valid');
                return;
            }
            
            // Check strict monotonicity
            for(let i = 1; i < measures.length; i++) {
                if (measures[i] <= measures[i-1]) {
                    feedback.innerHTML = "Le misure devono essere crescenti!";
                    feedback.className = "form-text text-danger";
                    inputElement.classList.add('is-invalid');
                    inputElement.classList.remove('is-valid');
                    return;
                }
            }
            
            const isPoleVault = raceName.toLowerCase().includes('asta');
            const minIncrement = isPoleVault ? 5 : 2; // in cm
            
            let valid = true;
            let errorMsg = "";
            let lastInc = 999;
            
            for (let i = 1; i < measures.length; i++) {
                const diffCm = Math.round((measures[i] - measures[i-1]) * 100);
                if (diffCm < minIncrement) {
                    valid = false;
                    errorMsg = `Errore TR 26.1: Incremento di ${diffCm}cm tra ${measures[i-1]} e ${measures[i]}. Minimo consentito: ${minIncrement}cm.`;
                    break;
                }
                if (diffCm > lastInc) {
                    valid = false;
                    errorMsg = `Errore TR 26.1: L'incremento non può aumentare. Precedente: ${lastInc}cm, Nuovo: ${diffCm}cm.`;
                    break;
                }
                lastInc = diffCm;
            }
            
            if (!valid) {
                feedback.innerHTML = errorMsg;
                feedback.className = "form-text text-danger";
                inputElement.classList.add('is-invalid');
                inputElement.classList.remove('is-valid');
            } else {
                feedback.innerHTML = "Progressione a norma WA TR 26.1 ✅";
                feedback.className = "form-text text-success";
                inputElement.classList.remove('is-invalid');
                inputElement.classList.add('is-valid');
            }
        }

            if (lower.includes('1200')) return 3;
            if (lower.includes('1500')) return 4;
            if (lower.includes('2000')) return 5;
            if (lower.includes('3000')) return 8;
            if (lower.includes('siepi')) return 8;

            return 15;
        }
