        function formatMinsToTime(totalMins) {
            let mins = totalMins % 1440;
            if (mins < 0) mins += 1440;
            const hh = Math.floor(mins / 60).toString().padStart(2, '0');
            const mm = (mins % 60).toString().padStart(2, '0');
            return hh + ':' + mm;
        }

        async function renderCallRoomTable() {
            const container = document.getElementById('cr-table-container');
            if (!container) return;
            
            const getOff = (k, def) => parseInt(localStorage.getItem(k) || def);
            const offsets = {
                corse: { cr1: getOff('cr1_corse', 30), cr2: getOff('cr2_corse', 20), track: getOff('track_corse', 10) },
                concorsi: { cr1: getOff('cr1_concorsi', 45), cr2: getOff('cr2_concorsi', 30), track: getOff('track_concorsi', 20) },
                alto: { cr1: getOff('cr1_alto', 50), cr2: getOff('cr2_alto', 35), track: getOff('track_alto', 30) },
                asta: { cr1: getOff('cr1_asta', 60), cr2: getOff('cr2_asta', 45), track: getOff('track_asta', 40) }
            };
            
            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const now = new Date();
            const nowMins = now.getHours() * 60 + now.getMinutes();
            
            let rowsData = [];
            
            races.forEach(r => {
                if (!r.scheduledTime) return; // Skip races without time
                if (r.isCompleted) return; // Skip completed
                const raceDay = parseInt(r.day) || 1;
                if (activeCallRoomDay > 0 && raceDay !== activeCallRoomDay) return;
                
                const [h, m] = r.scheduledTime.split(':').map(Number);
                const baseRaceMins = h * 60 + m;
                const dayBadge = `<span class="status-pill status-pill-neutral me-1" title="Giornata ${raceDay}">G${raceDay}</span>`;
                
                let cat = 'corse';
                const lower = r.name.toLowerCase();
                if (isPoleVault(r.name)) cat = 'asta';
                else if (isHighJump(r.name)) cat = 'alto';
                else if (['salto', 'lungo', 'triplo', 'peso', 'disco', 'martello', 'maniglia', 'giavellotto', 'vortex', 'palla', 'lancio', 'lanci'].some(k => lower.includes(k))) cat = 'concorsi';
                
                const o = offsets[cat];
                const raceIndex = currentMeeting.data.findIndex(d => d.nome_gara === r.name);
                const raceObj = raceIndex > -1 ? currentMeeting.data[raceIndex] : null;
                
                if (cat === 'corse' && raceObj && raceObj.numero_iscritti > 0) {
                    const savedTrackStr = localStorage.getItem('race_data_' + currentMeeting.id + '_' + raceIndex);
                    let heatsCount = 1;
                    let heatInterval = getMinutesPerHeat(r.name);
                    let heatAthletes = [];
                    let isConfigured = false;
                    
                    if (savedTrackStr) {
                        try {
                            const rd = JSON.parse(savedTrackStr);
                            if (rd.heats && rd.heats.length > 0) {
                                heatsCount = rd.heats.length;
                                heatAthletes = rd.heats.map(h => h.length);
                                isConfigured = true;
                            }
                            if (rd.heatInterval) heatInterval = parseInt(rd.heatInterval) || heatInterval;
                        } catch(e) {}
                    } else {
                        const isMid = isMiddleDistance(r.name);
                        const defLanes = isMid ? 12 : 6;
                        heatsCount = Math.max(1, Math.ceil(raceObj.numero_iscritti / defLanes));
                    }
                    
                    for (let i = 0; i < heatsCount; i++) {
                        const heatRaceMins = baseRaceMins + (i * heatInterval);
                        const subLabel = heatsCount > 1
                            ? `<span class="status-pill status-pill-info ms-2">Serie ${i+1}/${heatsCount}</span>`
                            : (isConfigured ? `<span class="status-pill status-pill-neutral ms-2">Serie Unica</span>` : '');
                        const athInfo = heatAthletes[i] !== undefined
                            ? `<small class="text-muted ms-1">(${heatAthletes[i]} atl.)</small>`
                            : (heatsCount > 1 ? `<small class="text-muted ms-1">(stima)</small>` : `<small class="text-muted ms-1">(${raceObj.numero_iscritti} atl.)</small>`);
                        
                        const isLastHeat = (i === heatsCount - 1);
                        const doneBtn = isLastHeat
                            ? `<button type="button" class="btn btn-sm btn-outline-success py-0 px-2 ms-2 d-print-none" title="Segna gara come conclusa" onclick="toggleRaceCompleted(\`${r.name.replace(/'/g, '&apos;')}\`, 1)">✓ Fine</button>`
                            : '';
                        rowsData.push({
                            raceDay,
                            raceMins: heatRaceMins,
                            timeStr: formatMinsToTime(heatRaceMins),
                            subTimeNote: heatsCount > 1 ? `Serie ${i+1} (+${i * heatInterval}')` : '',
                            nameHtml: `${dayBadge}<a href="#" onclick="showRace(${raceIndex}, null); return false;" class="text-decoration-none fw-bold" style="color: var(--app-text);">${r.name}</a> ${subLabel} ${athInfo}${doneBtn}`,
                            o
                        });
                    }
                } else {
                    let groupBadge = '';
                    if (raceIndex > -1) {
                        const savedFieldStr = localStorage.getItem('field_data_' + currentMeeting.id + '_' + raceIndex);
                        if (savedFieldStr) {
                            try {
                                const fd = JSON.parse(savedFieldStr);
                                if (fd.numGroups && fd.numGroups > 1) {
                                    groupBadge = `<span class="status-pill status-pill-info ms-2">${fd.numGroups} Gruppi (A-${String.fromCharCode(64 + fd.numGroups)})</span>`;
                                }
                            } catch(e) {}
                        }
                    }
                    const doneBtn = `<button type="button" class="btn btn-sm btn-outline-success py-0 px-2 ms-2 d-print-none" title="Segna gara come conclusa" onclick="toggleRaceCompleted(\`${r.name.replace(/'/g, '&apos;')}\`, 1)">✓ Fine</button>`;
                    rowsData.push({
                        raceDay,
                        raceMins: baseRaceMins,
                        timeStr: r.scheduledTime,
                        subTimeNote: '',
                        nameHtml: raceIndex > -1
                            ? `${dayBadge}<a href="#" onclick="showRace(${raceIndex}, null); return false;" class="text-decoration-none fw-bold" style="color: var(--app-text);">${r.name}</a> ${groupBadge}${doneBtn}`
                            : `${dayBadge}<span class="fw-bold">${r.name}</span>${doneBtn}`,
                        o
                    });
                }
            });
            
            rowsData.sort((a, b) => (a.raceDay !== b.raceDay ? a.raceDay - b.raceDay : a.raceMins - b.raceMins));

            let cntCr1 = 0, cntCr2 = 0, cntTrack = 0, cntLive = 0;
            
            let html = '<div class="table-container-card"><table class="table text-center align-middle tabular-nums"><thead class="table-dark"><tr><th>Orario Gara</th><th class="text-start">Gara / Serie</th><th>Apertura CR1</th><th>Apertura CR2</th><th>Ingresso Pista</th><th>Stato Live</th></tr></thead><tbody>';
            
            if (rowsData.length === 0) {
                html += `<tr><td colspan="6" class="py-4 text-muted">Nessuna gara con orario programmato. Inserisci gli orari nella <a href="#" onclick="showOverview(); return false;">Panoramica Meeting</a> per attivare il tabellone Call Room Live.</td></tr>`;
            }

            rowsData.forEach(item => {
                const { raceMins, timeStr, subTimeNote, nameHtml, o } = item;
                const cr1Mins = raceMins - o.cr1;
                const cr2Mins = raceMins - o.cr2;
                const trackMins = raceMins - o.track;
                
                let rowClass = "";
                let statoBadge = `<span class="status-pill status-pill-neutral">IN ATTESA</span>`;
                
                if (nowMins >= raceMins) {
                    rowClass = "table-success";
                    statoBadge = `<span class="status-pill status-pill-success">● IN CORSO</span>`;
                    cntLive++;
                } else if (nowMins >= trackMins) {
                    rowClass = "table-warning";
                    statoBadge = `<span class="status-pill status-pill-warning">IN PISTA</span>`;
                    cntTrack++;
                } else if (nowMins >= cr2Mins) {
                    rowClass = "table-danger";
                    statoBadge = `<span class="status-pill status-pill-danger">IN CR 2</span>`;
                    cntCr2++;
                } else if (nowMins >= cr1Mins) {
                    rowClass = "table-info";
                    statoBadge = `<span class="status-pill status-pill-info">IN CR 1</span>`;
                    cntCr1++;
                }
                
                html += `<tr class="${rowClass}">
                    <td class="fw-bold fs-5">${timeStr}${subTimeNote ? `<br><small class="text-muted fw-normal" style="font-size:0.75rem;">${subTimeNote}</small>` : ''}</td>
                    <td class="text-start">${nameHtml}</td>
                    <td><strong>${formatMinsToTime(cr1Mins)}</strong> <br><small class="text-muted">(-${o.cr1}')</small></td>
                    <td><strong>${formatMinsToTime(cr2Mins)}</strong> <br><small class="text-muted">(-${o.cr2}')</small></td>
                    <td><strong>${formatMinsToTime(trackMins)}</strong> <br><small class="text-muted">(-${o.track}')</small></td>
                    <td class="fw-bold">${statoBadge}</td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;

            const strip = document.getElementById('cr-summary-strip');
            if (strip) {
                strip.innerHTML = `
                    <div class="col-6 col-md-3">
                        <div class="kpi-card py-2 px-3" style="--kpi-color: #0ea5e9;">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="kpi-label mb-0">In CR 1</span>
                                <span class="status-pill status-pill-info">${cntCr1}</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="kpi-card py-2 px-3" style="--kpi-color: #f43f5e;">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="kpi-label mb-0">In CR 2</span>
                                <span class="status-pill status-pill-danger">${cntCr2}</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="kpi-card py-2 px-3" style="--kpi-color: #f59e0b;">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="kpi-label mb-0">Ingresso Pista</span>
                                <span class="status-pill status-pill-warning">${cntTrack}</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="kpi-card py-2 px-3" style="--kpi-color: #10b981;">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="kpi-label mb-0">In Corso</span>
                                <span class="status-pill status-pill-success">${cntLive}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function cleanRaceBaseName(name) {
            return (name || '')
                .replace(/\s*-\s*(Lista\s*Partecipanti|Risultati|Serie| Turno\s*\d+|Finale|Qualificazioni).*/i, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        window.toggleRaceCompleted = async function(raceName, forceState) {
            raceName = raceName.replace(/&apos;/g, "'");
            const r = await db.races.get(currentMeeting.id + '_' + raceName);
            if (!r) return;
            r.isCompleted = (forceState !== undefined) ? (forceState ? 1 : 0) : (r.isCompleted ? 0 : 1);
            await db.races.put(r);
            await buildSidebar();

            if (document.getElementById('wise-sync-container')) {
                await renderWiseChecklist();
            } else if (document.getElementById('cr-table-container')) {
                await renderCallRoomTable();
            } else if (document.getElementById('gantt-chart-container')) {
                await renderGanttChart();
            } else if (document.getElementById('overview-tbody')) {
                await showOverview();
            }
        };

        window.saveMeetingResultsUrl = async function() {
            const inp = document.getElementById('wise-results-url');
            if (!inp || !currentMeeting) return;
            const newUrl = inp.value.trim();
            currentMeeting.resultsUrl = newUrl;
            await db.meetings.put(currentMeeting);
            const fb = document.getElementById('wise-sync-feedback');
            if (fb) {
                fb.className = 'alert alert-success py-2 px-3 mb-3 small fw-bold';
                fb.textContent = '✅ URL Risultati FIDAL salvato per questo meeting.';
            }
        };

        window.pasteFromClipboardWise = async function() {
            const ta = document.getElementById('wise-paste-input');
            if (!ta) return;
            try {
                const txt = await navigator.clipboard.readText();
                if (txt) {
                    ta.value = txt;
                    await parseWiseContentAndSync();
                } else {
                    ta.focus();
                }
            } catch (e) {
                ta.focus();
            }
        };

        window.handleWiseFileUpload = function(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const ta = document.getElementById('wise-paste-input');
                if (ta) ta.value = ev.target.result || '';
                await parseWiseContentAndSync();
            };
            reader.readAsText(file);
        };

        window.parseWiseContentAndSync = async function() {
            const ta = document.getElementById('wise-paste-input');
            const fb = document.getElementById('wise-sync-feedback');
            if (!ta || !currentMeeting) return;
            const raw = ta.value.trim();
            if (!raw) {
                if (fb) {
                    fb.className = 'alert alert-warning py-2 px-3 mb-3 small fw-bold';
                    fb.textContent = '⚠️ Incolla prima il testo (Ctrl+A / Ctrl+C) o il codice HTML copiato dalla pagina risultati FIDAL.';
                }
                return;
            }

            // Extract candidate strings from HTML links/cells AND plain text lines
            const candidates = [];
            if (raw.includes('<a') || raw.includes('<table') || raw.includes('<html')) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(raw, 'text/html');
                doc.querySelectorAll('a, td, li, h3, h4').forEach(el => {
                    const t = (el.textContent || '').trim();
                    if (t.length >= 4) candidates.push(t);
                });
            }
            raw.split(/[\r\n\t]+/).forEach(line => {
                const t = line.trim();
                if (t.length >= 4) candidates.push(t);
            });

            const normCandidates = candidates.map(c => cleanRaceBaseName(c)).filter(c => c.length >= 4);
            const fullRawNorm = raw.replace(/\s+/g, ' ').toLowerCase();

            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            let newlyCompleted = [];
            let alreadyCompleted = 0;

            for (const r of races) {
                const baseName = cleanRaceBaseName(r.name);
                if (!baseName || baseName.length < 3) continue;

                const matched = normCandidates.some(c => c === baseName || c.includes(baseName) || (baseName.includes(c) && c.length >= 6))
                    || fullRawNorm.includes(baseName);

                if (matched) {
                    if (!r.isCompleted) {
                        r.isCompleted = 1;
                        await db.races.put(r);
                        newlyCompleted.push(r.name.replace(/\s*-\s*Lista Partecipanti/i, ''));
                    } else {
                        alreadyCompleted++;
                    }
                }
            }

            await buildSidebar();
            await renderWiseChecklist();

            if (fb) {
                if (newlyCompleted.length > 0) {
                    fb.className = 'alert alert-success py-2 px-3 mb-3 small fw-bold';
                    fb.innerHTML = `✅ Sincronizzazione completata! <strong>${newlyCompleted.length} nuove gare segnate come concluse:</strong> ${newlyCompleted.join(', ')}${alreadyCompleted ? ` (${alreadyCompleted} erano già concluse)` : ''}.`;
                } else if (alreadyCompleted > 0) {
                    fb.className = 'alert alert-info py-2 px-3 mb-3 small fw-bold';
                    fb.innerHTML = `ℹ️ Tutte le <strong>${alreadyCompleted} gare</strong> presenti nel testo incollato risultavano già segnate come concluse.`;
                } else {
                    fb.className = 'alert alert-warning py-2 px-3 mb-3 small fw-bold';
                    fb.innerHTML = `⚠️ Nessuna corrispondenza trovata nel testo incollato. Assicurati di aver copiato l'elenco gare dalla pagina Risultati FIDAL oppure usa la spunta rapida 1-Click qui sotto.`;
                }
            }
        };

        window.markPastRacesCompleted = async function() {
            const races = await db.races.where('meetingId').equals(currentMeeting.id).toArray();
            const now = new Date();
            const nowMins = now.getHours() * 60 + now.getMinutes();
            let count = 0;

            for (const r of races) {
                if (r.isCompleted || !r.scheduledTime || !r.scheduledTime.includes(':')) continue;
                const [hh, mm] = r.scheduledTime.split(':').map(Number);
                const raceObj = currentMeeting.data.find(d => d.nome_gara === r.name);
                const dur = raceObj ? Math.round(estimateDuration(raceObj.nome_gara, raceObj.numero_iscritti, isMiddleDistance(raceObj.nome_gara))) : 15;
                if (nowMins >= (hh * 60 + mm + dur)) {
                    r.isCompleted = 1;
                    await db.races.put(r);
                    count++;
                }
            }
            await buildSidebar();
            await renderWiseChecklist();
            const fb = document.getElementById('wise-sync-feedback');
            if (fb) {
                fb.className = 'alert alert-info py-2 px-3 mb-3 small fw-bold';
                fb.textContent = count > 0
                    ? `⏱ ${count} gare con orario di fine superato sono state segnate come concluse.`
                    : `ℹ️ Nessuna gara attiva ha ancora superato il proprio orario di fine stimata (${now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}).`;
            }
        };

        window.saveRaceTime = async function(name, timeVal, inputElem, raceIndex) {
            name = name.replace(/&apos;/g, "'");
            const r = await db.races.get(currentMeeting.id + '_' + name);
            let raceDay = 1;
            if (r) {
                r.scheduledTime = timeVal;
                raceDay = parseInt(r.day) || 1;
                await db.races.put(r);
            }
            if (inputElem && inputElem.parentElement) {
                const printSpan = inputElem.parentElement.querySelector('.d-print-inline');
                if (printSpan) printSpan.textContent = `G${raceDay} · ${timeVal || '--:--'}`;
            }
            if (raceIndex !== undefined) {
                const hintEl = document.getElementById('overview-end-hint-' + raceIndex);
                if (hintEl && currentMeeting.data[raceIndex]) {
                    if (timeVal) {
                        const raceObj = currentMeeting.data[raceIndex];
                        const dur = Math.max(4, Math.round(estimateDuration(raceObj.nome_gara, raceObj.numero_iscritti, isMiddleDistance(raceObj.nome_gara))));
                        const [hh, mm] = timeVal.split(':').map(Number);
                        const endStr = formatMinsToTime(hh * 60 + mm + dur);

function timeToSeconds(t) {
            if (!t) return 999999;
            t = t.trim();
            if (t.includes(':')) {
                const parts = t.split(':');
                return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
            return parseFloat(t) || 999999;
        }



        function validateProgression(inputElement, raceName) {
            const feedback = inputElement.nextElementSibling;
            const str = inputElement.value.replace(/,/g, ' ').trim();
            if (!str) {
                feedback.innerHTML = "Inserisci le misure separate da spazio o virgola. Saranno stampate sul foglio gara.";
                feedback.className = "form-text text-muted";
                inputElement.classList.remove('is-invalid', 'is-valid');
                return;
            }
            
            const measures = str.split(/\s+/).map(x => parseFloat(x));
            if (measures.some(isNaN)) {
                feedback.innerHTML = "Formato non valido. Inserisci solo numeri (es. 1.80 1.85).";
                feedback.className = "form-text text-danger";
                inputElement.classList.add('is-invalid');
                inputElement.classList.remove('is-valid');
                return;
            }
            
            // Check strict monotonicity
            for(let i = 1; i < measures.length; i++) {
                if (measures[i] <= measures[i-1]) {
                    feedback.innerHTML = "Le misure devono essere crescenti!";
                    feedback.className = "form-text text-danger";
                    inputElement.classList.add('is-invalid');
                    inputElement.classList.remove('is-valid');
                    return;
                }
            }
            
            const isPoleVault = raceName.toLowerCase().includes('asta');
            const minIncrement = isPoleVault ? 5 : 2; // in cm
            
            let valid = true;
            let errorMsg = "";
            let lastInc = 999;
            
            for (let i = 1; i < measures.length; i++) {
                const diffCm = Math.round((measures[i] - measures[i-1]) * 100);
                if (diffCm < minIncrement) {
                    valid = false;
                    errorMsg = `Errore TR 26.1: Incremento di ${diffCm}cm tra ${measures[i-1]} e ${measures[i]}. Minimo consentito: ${minIncrement}cm.`;
                    break;
                }
                if (diffCm > lastInc) {
                    valid = false;
                    errorMsg = `Errore TR 26.1: L'incremento non può aumentare. Precedente: ${lastInc}cm, Nuovo: ${diffCm}cm.`;
                    break;
                }
                lastInc = diffCm;
            }
            
            if (!valid) {
                feedback.innerHTML = errorMsg;
                feedback.className = "form-text text-danger";
                inputElement.classList.add('is-invalid');
                inputElement.classList.remove('is-valid');
            } else {
                feedback.innerHTML = "Progressione a norma WA TR 26.1 ✅";
                feedback.className = "form-text text-success";
                inputElement.classList.remove('is-invalid');
                inputElement.classList.add('is-valid');
            }
        }

            if (lower.includes('1200')) return 3;
            if (lower.includes('1500')) return 4;
            if (lower.includes('2000')) return 5;
            if (lower.includes('3000')) return 8;
            if (lower.includes('siepi')) return 8;

            return 15;
        }

            const battuta1 = b1Input ? b1Input.value.trim() : (prevCfg.battuta1 || '');

            let allAthletes = [...race.iscritti].map(i => ({...i, val: parseAccreditoFloat(i.accredito)}));
            
            // Split into groups by accreditation tiers (Gruppo A = best marks, Gruppo B = next tier, etc.)
            let groups = [];
            if (numGroups > 1 && allAthletes.length > 1) {
                allAthletes.sort((a, b) => b.val - a.val);
                const actualGroups = Math.min(numGroups, allAthletes.length);
                const baseSize = Math.floor(allAthletes.length / actualGroups);
                const extra = allAthletes.length % actualGroups;
                let cursor = 0;
                for (let g = 0; g < actualGroups; g++) {
                    const size = baseSize + (g < extra ? 1 : 0);
                    groups.push(allAthletes.slice(cursor, cursor + size));
                    cursor += size;
                }
            } else {
                groups = [allAthletes];

            // Apply starting order inside each group

                    grp.sort((a, b) => a.val - b.val);

        function generateTrack(index, isMiddle) {
            const race = currentMeeting.data[index];
            const lanesInputStr = document.getElementById(`lanes-${index}`).value;
            const intervalInputEl = document.getElementById(`heat-interval-${index}`);
            const heatInterval = intervalInputEl ? (parseInt(intervalInputEl.value) || getMinutesPerHeat(race.nome_gara)) : getMinutesPerHeat(race.nome_gara);
            
            let activeLanes = [];
            let maxLanes = 6;
            
            if (isMiddle) {
                maxLanes = parseInt(lanesInputStr) || 12;
            } else {
                activeLanes = lanesInputStr.replace(/[^0-9,]/g, '').split(',').map(Number).filter(x => x > 0);
                if (activeLanes.length === 0) activeLanes = [1,2,3,4,5,6];
                maxLanes = activeLanes.length;
            }
            
            let iscritti = [...race.iscritti].map(i => ({...i, val: timeToSeconds(i.accredito)}));
            iscritti.sort((a, b) => a.val - b.val); // fastest first
            
            const total = iscritti.length;
            const heatsCount = Math.ceil(total / maxLanes);
            
            const heats = Array.from({length: heatsCount}, () => []);
            let dir = 1;
            let current = 0;
            
            // Zig zag distribution
            iscritti.forEach(a => {
                heats[current].push(a);
                if (dir === 1) {
                    if (current < heatsCount - 1) current++;
                    else dir = -1;
                } else {
                    if (current > 0) current--;
                    else dir = 1;
                }
            });
            
            const raceData = { heats, isMiddle, maxLanes, activeLanes, lanesInputStr, heatInterval };
            localStorage.setItem('race_data_' + currentMeeting.id + '_' + index, JSON.stringify(raceData));
            
            const badge = document.getElementById(`est-time-${index}`);
            if (badge) {
                const updatedTime = estimateDuration(race.nome_gara, total, isMiddle, heatsCount, heatInterval);
                badge.textContent = `⏱ Stima: ${Math.round(updatedTime)} min`;
            }
            
            renderTrackHeats(index);
        }

        function moveAthlete(index, fromHeat, pettorale, toHeatSelect) {
            const toHeat = parseInt(toHeatSelect.value);
            if (fromHeat === toHeat) return;
            
            let raceData = JSON.parse(localStorage.getItem('race_data_' + currentMeeting.id + '_' + index));
            let heats = raceData.heats;
            
            // Find athlete
            let athleteIndex = heats[fromHeat].findIndex(a => a.pettorale === pettorale);
            if (athleteIndex > -1) {
                const athlete = heats[fromHeat].splice(athleteIndex, 1)[0];
                heats[toHeat].push(athlete);
                
                localStorage.setItem('race_data_' + currentMeeting.id + '_' + index, JSON.stringify(raceData));
                renderTrackHeats(index);
            }
        }

        function renderTrackHeats(index) {
            const race = currentMeeting.data[index];
            const raceDataStr = localStorage.getItem('race_data_' + currentMeeting.id + '_' + index);
            if (!raceDataStr) return;
            
            const raceData = JSON.parse(raceDataStr);
            const heats = raceData.heats;
            const isMiddle = raceData.isMiddle;
            const maxLanes = raceData.maxLanes;
            const activeLanes = raceData.activeLanes || Array.from({length: maxLanes}, (_,i)=>i+1);
            const heatsCount = heats.length;
            const heatInterval = parseInt(raceData.heatInterval) || getMinutesPerHeat(race.nome_gara);
            
            const schedInput = document.getElementById(`sched-time-${index}`);
            const schedTime = schedInput ? schedInput.value : '';
            
            const getOff = (k, def) => parseInt(localStorage.getItem(k) || def);
            const cr1Off = getOff('cr1_corse', 30);
            const cr2Off = getOff('cr2_corse', 20);
            const trackOff = getOff('track_corse', 10);
            
            let baseRaceMins = null;
            if (schedTime && schedTime.includes(':')) {
                const [hh, mm] = schedTime.split(':').map(Number);
                baseRaceMins = hh * 60 + mm;
            }
            
            let html = `<div class="d-flex justify-content-between align-items-center mb-3 d-print-none">
                <h4 class="fw-bold mb-0">Composizione Serie (${heatsCount} Serie Generate — ${isMiddle ? `Max ${maxLanes} atl./serie` : `${activeLanes.length} corsie attive`})</h4>
                <button class="btn btn-outline-secondary btn-sm fw-semibold" onclick="window.print()">🖨️ Stampa</button>
            </div>`;
            
            if (baseRaceMins !== null) {
                html += `
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>🕒 Orari Esplosi Call Room & Partenza per Serie (Intervallo: ${heatInterval} min)</span>
                        <span class="status-pill status-pill-warning tabular-nums">1ª Serie: ${schedTime}</span>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-sm table-bordered text-center align-middle mb-0 tabular-nums" style="font-size: 0.85rem;">
                            <thead class="table-light">
                                <tr>
                                    <th>Serie</th>
                                    <th>Atleti</th>
                                    <th>Apertura CR1 (-${cr1Off}')</th>
                                    <th>Uscita CR2 (-${cr2Off}')</th>
                                    <th>Ingresso Pista (-${trackOff}')</th>
                                    <th>Orario Partenza</th>
                                </tr>
                            </thead>
                            <tbody>`;
                heats.forEach((h, i) => {
                    const hMins = baseRaceMins + (i * heatInterval);
                    html += `<tr>
                        <td class="fw-bold">Serie ${i+1}</td>
                        <td>${h.length}</td>
                        <td class="table-info">${formatMinsToTime(hMins - cr1Off)}</td>
                        <td class="table-danger">${formatMinsToTime(hMins - cr2Off)}</td>
                        <td class="table-warning">${formatMinsToTime(hMins - trackOff)}</td>
                        <td class="table-success fw-bold fs-6">${formatMinsToTime(hMins)}</td>
                    </tr>`;
                });
                html += `</tbody></table></div></div>`;
            } else {
                html += `<div class="alert alert-warning py-2 small d-print-none">💡 <strong>Suggerimento Call Room:</strong> Inserisci l'<strong>Orario (1ª Serie/Gara)</strong> in alto a destra per esplodere automaticamente gli orari di Call Room (CR1, CR2, Ingresso Pista) e di partenza per ciascuna delle ${heatsCount} serie.</div>`;
            }
            
            // Preferred lanes for standard sprint
            const pref6 = [3, 4, 5, 6, 2, 1];
            const pref8 = [4, 5, 3, 6, 2, 7, 1, 8];
            const pref9 = [5, 6, 4, 7, 3, 8, 2, 9, 1];
            
            let basePref = pref6;
            const maxActive = Math.max(...activeLanes);
            if (maxActive > 6) basePref = pref8;
            if (maxActive > 8) basePref = pref9;
            
            // Filter basePref by activeLanes
            let pref = basePref.filter(l => activeLanes.includes(l));
            activeLanes.forEach(l => {
                if (!pref.includes(l)) pref.push(l);
            });
            const topPrefSet = new Set(pref.slice(0, Math.min(4, pref.length)));
            
            heats.forEach((h, i) => {
                let heatTimingBadges = '';
                if (baseRaceMins !== null) {
                    const hMins = baseRaceMins + (i * heatInterval);
                    heatTimingBadges = `
                        <div class="d-flex flex-wrap gap-1 tabular-nums">
                            <span class="status-pill status-pill-info">CR1: ${formatMinsToTime(hMins - cr1Off)}</span>
                            <span class="status-pill status-pill-danger">CR2: ${formatMinsToTime(hMins - cr2Off)}</span>
                            <span class="status-pill status-pill-warning">Pista: ${formatMinsToTime(hMins - trackOff)}</span>
                            <span class="status-pill status-pill-success">🕒 Start: ${formatMinsToTime(hMins)}</span>
                        </div>`;
                }
                
                html += `<div class="mt-4 table-container-card" style="page-break-inside: avoid;">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h5 class="mb-0 fw-bold">Serie ${i+1} <small class="text-muted fw-normal">(${h.length} atleti)</small></h5>
                        ${heatTimingBadges}
                    </div>
                    <table class="table table-bordered table-sm align-middle tabular-nums">
                    <thead class="table-light"><tr><th width="8%">${isMiddle ? 'Pos' : 'Corsia'}</th><th width="8%">Pett</th><th>Atleta</th><th>Società</th><th width="10%">SB</th><th width="15%">Risultato</th><th width="6%">Pos</th><th class="d-print-none" width="10%">Sposta</th></tr></thead><tbody>`;
                
                if (!isMiddle) {
                    h.forEach((a, j) => {
                        a.lane = pref[j] || '-';
                    });
                    h.sort((a,b) => (a.lane === '-' ? 99 : a.lane) - (b.lane === '-' ? 99 : b.lane));
                } else {
                    h.forEach((a, j) => {
                        a.lane = j + 1;
                    });
                }
                
                h.forEach(a => {
                    const athleteName = a.fidal_link ? `<a href="${a.fidal_link}" target="_blank" class="text-decoration-none fw-bold" style="color: var(--app-text);">${a.nominativo}</a>` : `<span class="fw-bold">${a.nominativo}</span>`;
                    const isPrefLane = !isMiddle && topPrefSet.has(a.lane);
                    
                    let selectHtml = `<select class="form-select form-select-sm" onchange="moveAthlete(${index}, ${i}, '${a.pettorale}', this)">`;
                    for(let x=0; x<heatsCount; x++) {
                        selectHtml += `<option value="${x}" ${x===i ? 'selected' : ''}>S ${x+1}</option>`;
                    }
                    selectHtml += `</select>`;
                    
                    html += `<tr>
                        <td><span class="lane-badge ${isPrefLane ? 'pref-lane' : ''}">${a.lane}</span></td>
                        <td class="font-monospace">${a.pettorale}</td>
                        <td>${athleteName}</td>
                        <td><small class="text-muted">${(a.societa || '').substring(0,24)}</small></td>
                        <td class="font-monospace fw-semibold">${a.accredito}</td>
                        <td></td>
                        <td></td>
                        <td class="d-print-none">${selectHtml}</td>
                    </tr>`;
                });
                
                html += `</tbody></table></div>`;
            });
            
            if (isMiddle) {
                const numLaps = getLaps(race.nome_gara);
                const savedLapStyle = localStorage.getItem('lap_style_' + currentMeeting.id + '_' + index) || 'normal';
                const lapStyleEl = document.getElementById('lap-style-' + index);
                const lapStyle = lapStyleEl ? lapStyleEl.value : savedLapStyle;
                localStorage.setItem('lap_style_' + currentMeeting.id + '_' + index, lapStyle);

                html += `<div style="page-break-before: always;" class="mt-5"></div>
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 mt-4 d-print-none gap-2">
                    <h4 class="mb-0 fw-bold" style="color: var(--app-accent-fg);">🔄 Foglio Contagiri (${race.nome_gara})</h4>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <select id="lap-style-${index}" class="form-select form-select-sm w-auto" onchange="renderTrackHeats(${index})">
                            <option value="normal" ${lapStyle === 'normal' ? 'selected' : ''}>Stile Normale FIDAL (Griglia Vuota)</option>
                            <option value="wa" ${lapStyle === 'wa' ? 'selected' : ''}>Stile World Athletics (Precompilato)</option>
                        </select>
                        <a href="https://matteomircoli.it/contagiristatico/garav2.html" target="_blank" class="btn btn-outline-success btn-sm fw-semibold">⏱ Contagiri Elettronico</a>
                        <button class="btn btn-outline-primary btn-sm fw-semibold" onclick="window.print()">🖨️ Stampa Foglio Cartaceo</button>
                    </div>
                </div>
                `;

                html += `<h4 class="mt-4 d-none d-print-block">Foglio Contagiri - ${race.nome_gara}</h4>`;

                if (lapStyle === 'normal') {
                    html += `
                    <div class="d-print-none alert alert-info py-2 small"><strong>Stile Normale:</strong> Griglia vuota. Il giudice segna a mano il pettorale in base alla posizione (Pos).</div>`;
                    
                    heats.forEach((h, i) => {
                        if (h.length === 0) return;
                        html += `<div class="mt-3 table-container-card" style="page-break-inside: avoid;">
                            <div class="card-header fw-bold">Contagiri - Serie ${i+1}</div>
                            <table class="table table-bordered table-sm text-center tabular-nums" style="font-size: 0.8rem;">
                            <thead class="table-light"><tr><th width="5%">Pos</th><th width="10%">Pettorale</th>`;
                        for(let lap=numLaps; lap>=2; lap--) {
                            html += `<th>-${lap}</th>`;
                        }
                        html += `<th>ARRIVO</th></tr></thead><tbody>`;
                        
                        const numRows = h.length + 3;
                        for (let row = 1; row <= numRows; row++) {
                            html += `<tr><td><strong>${row}°</strong></td><td></td>`;
                            for(let lap=1; lap<=numLaps; lap++) {
                                html += `<td></td>`;
                            }
                            html += `</tr>`;
                        }
                        
                        html += `</tbody></table></div>`;
                    });
                } else {
                    html += `
                    <div class="d-print-none alert alert-info py-2 small"><strong>Stile World Athletics:</strong> Griglia precompilata con Pettorali/Nomi. Il giudice spunta il giro al passaggio dell'atleta.</div>`;
                    
                    heats.forEach((h, i) => {
                        if (h.length === 0) return;
                        const sortedH = [...h].sort((a,b) => (a.pettorale || '999').localeCompare(b.pettorale || '999'));
                        
                        html += `<div class="mt-3 table-container-card" style="page-break-inside: avoid;">
                            <div class="card-header fw-bold">Contagiri - Serie ${i+1}</div>
                            <table class="table table-bordered table-sm text-center align-middle tabular-nums" style="font-size: 0.8rem;">
                            <thead class="table-light"><tr><th width="8%">Pett.</th><th width="15%">Atleta</th>`;
                        for(let lap=numLaps; lap>=2; lap--) {
                            html += `<th>-${lap}</th>`;
                        }
                        html += `<th>ARRIVO</th></tr></thead><tbody>`;
                        
                        sortedH.forEach(a => {
                            html += `<tr>
                                <td class="fw-bold">${a.pettorale || ''}</td>
                                <td class="text-start">${a.nominativo}<br><small class="text-muted">${a.societa || ''}</small></td>`;
                            for(let lap=1; lap<=numLaps; lap++) {
                                html += `<td></td>`;
                            }
                            html += `</tr>`;
                        });
                        
                        for(let ex=0; ex<3; ex++) {
                            html += `<tr><td></td><td></td>`;
                            for(let lap=1; lap<=numLaps; lap++) {
                                html += `<td></td>`;
                            }
                            html += `</tr>`;
                        }
                        
                        html += `</tbody></table></div>`;
                    });
                }
            }
            
            document.getElementById(`results-${index}`).innerHTML = html;
            localStorage.setItem('race_' + currentMeeting.id + '_' + index, html);
        }

        </script>
</body>
</html>
